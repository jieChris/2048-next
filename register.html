<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 注册</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260606-fillframe">
  <link rel="icon" type="image/x-icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="shortcut icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png?v=20260704-png-opt">
  <link rel="manifest" href="/site.webmanifest?v=20260704-pwa-icons">
  <script src="/js/core_night_mode_preload.js?v=20260822-theme-inheritance-v1"></script>
  <script src="/js/beta_access_preload.js?v=20260708-01"></script>
  <link href="style/main.css?v=20260827-mobile-surface-v1" rel="stylesheet" type="text/css">
  <link href="style/palette_page.css?v=20260310-01" rel="stylesheet" type="text/css">
  <link href="style/account_page.css?v=20260321-01" rel="stylesheet" type="text/css">
  <link href="style/register_page.css?v=20260827-mobile-initial-state-v1" rel="stylesheet" type="text/css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="turnstile-site-key" content="0x4AAAAAACuEcCjf-_Mtr_HS">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://2048next.cn https://www.2048next.cn; img-src 'self' data:; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; frame-src https://challenges.cloudflare.com;">
</head>
<body data-page="register-hub" data-i18n-ready="0">
  <main class="palette-page-shell register-page-shell">
    <header class="palette-page-header">
      <div class="palette-title-wrap">
        <p class="palette-kicker" id="register-kicker">2048 在线中心</p>
        <h1 class="palette-title" id="register-title">注册账号</h1>
        <p class="palette-subtitle" id="register-subtitle">完成人机验证并通过昵称校验后即可创建账号。</p>
      </div>
      <nav class="palette-nav">
        <a class="replay-button palette-nav-btn" href="account_settings.html" id="register-nav-login">返回登录</a>
        <a class="replay-button palette-nav-btn" href="/" id="register-nav-home">首页</a>
      </nav>
    </header>

    <section class="card-surface register-card">
      <div class="panel-head">
        <h2 id="register-heading">账号注册</h2>
      </div>

      <div class="account-auth-grid register-auth-grid">
        <label for="register-email" id="register-email-label">邮箱</label>
        <input id="register-email" class="account-input" type="email" placeholder="请输入邮箱">

        <label for="register-password" id="register-password-label">密码</label>
        <input id="register-password" class="account-input" type="password" placeholder="请输入密码">

        <label for="register-nickname" id="register-nickname-label">昵称</label>
        <div class="register-nickname-field">
          <input id="register-nickname" class="account-input" type="text" maxlength="10" placeholder="请输入昵称">
          <span id="register-nickname-feedback" class="register-nickname-feedback" aria-live="polite"></span>
        </div>

        <label id="register-turnstile-label">人机验证</label>
        <div id="register-turnstile-wrap" class="register-turnstile-wrap">
          <div id="register-turnstile-widget"></div>
        </div>

        <label for="register-email-code" id="register-email-code-label">邮箱验证码</label>
        <input id="register-email-code" class="account-input" type="text" maxlength="6" autocomplete="one-time-code" placeholder="请输入邮箱中的 6 位验证码">
      </div>

      <div class="account-action-row register-action-row">
        <button id="register-send-code-btn" class="replay-button" type="button">发送验证码</button>
        <button id="register-submit-btn" class="replay-button" type="button">注册</button>
        <a id="register-back-login-btn" class="replay-button" href="account_settings.html">返回登录</a>
      </div>

      <p id="register-tip" class="account-tip" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script type="module" src="./src/entries/register.ts"></script>
</body>
</html>
