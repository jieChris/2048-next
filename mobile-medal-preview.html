<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移动端勋章预览</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 28px;
      background: #202326;
    }

    .mobile-preview-frame {
      width: min(390px, 100%);
      height: 844px;
      max-width: 100%;
      overflow: hidden;
      border: 10px solid #151719;
      border-radius: 24px;
      background: #151719;
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.42);
    }

    iframe {
      display: block;
      width: 100%;
      height: 844px;
      border: 0;
      background: #f3ece0;
    }

    @media (max-width: 460px) {
      body { padding: 0; }

      .mobile-preview-frame {
        width: 100%;
        height: 100vh;
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main class="mobile-preview-frame">
    <iframe id="mobile-medal-frame" title="移动端成就勋章墙" src="medal-wall.html?mobile-medal-preview=v1"></iframe>
  </main>
  <script>
    const frame = document.getElementById("mobile-medal-frame");
    let attempts = 0;

    function revealMedalWall() {
      const doc = frame.contentDocument;
      const wall = doc?.querySelector(".achievements-list-card");
      if (wall && doc.querySelector(".achievement-family-card")) {
        const view = frame.contentWindow;
        view.scrollTo(0, Math.max(0, wall.offsetTop - 16));
        return;
      }
      if (attempts++ < 100) window.setTimeout(revealMedalWall, 100);
    }

    frame.addEventListener("load", revealMedalWall);
  </script>
</body>
</html>
