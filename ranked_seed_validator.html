<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排位种子校验器</title>
  <style>
    :root {
      color-scheme: dark;
      --page-bg:
        radial-gradient(circle at top, rgba(68, 127, 255, 0.28), transparent 34%),
        linear-gradient(180deg, #07111f 0%, #0b1222 38%, #050812 100%);
      --surface: rgba(11, 20, 38, 0.84);
      --surface-strong: rgba(17, 29, 53, 0.94);
      --surface-soft: rgba(255, 255, 255, 0.05);
      --border: rgba(132, 168, 255, 0.22);
      --text: #ecf2ff;
      --muted: #9eb1d8;
      --accent: #62a8ff;
      --accent-strong: #8d6bff;
      --success: #8bf0c9;
      --error: #ff90a8;
      --shadow: 0 28px 80px rgba(2, 7, 18, 0.5);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --cell-empty: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    .validator-shell {
      width: min(1200px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .validator-hero {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(98, 168, 255, 0.18), rgba(141, 107, 255, 0.12)),
        var(--surface);
      box-shadow: var(--shadow);
    }

    .validator-kicker {
      margin: 0 0 10px;
      color: #a7c6ff;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .validator-title {
      margin: 0;
      font-size: clamp(32px, 5vw, 56px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .validator-intro {
      max-width: 760px;
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
    }

    .validator-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .validator-badge {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: #d8e3ff;
      font-size: 13px;
    }

    .validator-grid {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 20px;
      margin-top: 22px;
    }

    .validator-panel {
      min-width: 0;
      padding: 22px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .validator-panel h2 {
      margin: 0 0 16px;
      font-size: 18px;
      letter-spacing: 0.01em;
    }

    .validator-field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .validator-field label {
      color: #ccdbff;
      font-size: 13px;
      font-weight: 700;
    }

    .validator-field small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .validator-field input,
    .validator-field select,
    .validator-field textarea {
      width: 100%;
      border: 1px solid rgba(147, 176, 255, 0.2);
      border-radius: var(--radius-md);
      background: rgba(5, 10, 20, 0.72);
      color: var(--text);
      padding: 12px 14px;
      font: inherit;
    }

    .validator-field textarea {
      min-height: 170px;
      resize: vertical;
      font-family: "Cascadia Code", "JetBrains Mono", monospace;
      line-height: 1.5;
    }

    .validator-view-switch {
      display: inline-flex;
      max-width: 100%;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .validator-pill {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .validator-pill[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #03101d;
    }

    .validator-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .validator-btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .validator-btn:hover {
      transform: translateY(-1px);
    }

    .validator-btn-primary {
      color: #06111c;
      background: linear-gradient(135deg, #87b8ff, #7af0d9);
    }

    .validator-btn-secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .validator-card-action {
      width: 100%;
      margin-top: 12px;
    }

    .validator-status {
      min-height: 24px;
      margin-top: 16px;
      font-size: 13px;
      font-weight: 700;
    }

    .validator-status[data-status-kind="success"] {
      color: var(--success);
    }

    .validator-status[data-status-kind="error"] {
      color: var(--error);
    }

    .validator-status[data-status-kind="info"] {
      color: #a7c6ff;
    }

    .validator-result-meta {
      display: grid;
      min-width: 0;
      gap: 10px;
      margin-bottom: 18px;
    }

    .validator-meta-row {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .validator-meta-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .validator-meta-value {
      min-width: 0;
      text-align: right;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .validator-result-boards {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .validator-result-card {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .validator-direction-summary {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
      font-weight: 700;
    }

    .validator-direction-boards {
      display: grid;
      gap: 12px;
    }

    .validator-result-title {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .validator-board {
      display: grid;
      grid-template-columns: repeat(var(--board-columns, 4), minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(3, 9, 20, 0.66);
    }

    .validator-cell {
      min-height: 56px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: -0.03em;
      background: var(--cell-empty);
      color: #e8f0ff;
    }

    .validator-cell.is-empty::before {
      content: ".";
      color: rgba(255, 255, 255, 0.24);
      font-size: 24px;
    }

    .validator-cell[data-tile="2"] {
      background: linear-gradient(135deg, #9fdbff, #60b4ff);
      color: #05223b;
    }

    .validator-cell[data-tile="4"] {
      background: linear-gradient(135deg, #ffdca8, #ff9b61);
      color: #341300;
    }

    .validator-cell[data-tile="8"],
    .validator-cell[data-tile="16"],
    .validator-cell[data-tile="32"],
    .validator-cell[data-tile="64"] {
      background: linear-gradient(135deg, rgba(141, 107, 255, 0.82), rgba(98, 168, 255, 0.72));
    }

    .validator-cell[data-tile="128"],
    .validator-cell[data-tile="256"],
    .validator-cell[data-tile="512"],
    .validator-cell[data-tile="1024"],
    .validator-cell[data-tile="2048"],
    .validator-cell[data-tile="4096"] {
      background: linear-gradient(135deg, rgba(122, 240, 217, 0.84), rgba(98, 168, 255, 0.82));
      color: #031019;
    }

    .validator-result-json {
      margin: 18px 0 0;
      border-radius: 18px;
      padding: 16px;
      overflow: auto;
      max-height: 320px;
      background: rgba(3, 9, 20, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cfe0ff;
      font-family: "Cascadia Code", "JetBrains Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 920px) {
      .validator-grid {
        grid-template-columns: 1fr;
      }
      .validator-shell {
        width: min(100vw - 20px, 1200px);
        padding-top: 16px;
      }
      .validator-hero,
      .validator-panel {
        padding: 18px;
      }
      .validator-view-switch {
        display: flex;
        flex-wrap: wrap;
      }
      .validator-pill {
        flex: 1 1 88px;
      }
    }
  </style>
</head>
<body>
  <main class="validator-shell">
    <section class="validator-hero">
      <p class="validator-kicker">离线验证工具</p>
      <h1 class="validator-title">排位种子校验器</h1>
      <p class="validator-intro">
        只用于本地安全验证。手工输入排位模式、种子、棋盘和 stepCount，
        复现确定性出块结果。这个页面不会连接线上页面，也不会读取浏览器运行时里的种子。
      </p>
      <div class="validator-badges">
        <span class="validator-badge">仅手动输入种子</span>
        <span class="validator-badge">离线 / 本地验证</span>
        <span class="validator-badge">不读取线上状态</span>
      </div>
    </section>

    <div class="validator-grid">
      <section class="validator-panel">
        <h2>输入</h2>

        <div class="validator-field">
          <label for="validator-mode">排位模式</label>
          <select id="validator-mode"></select>
        </div>

        <div class="validator-field">
          <label for="validator-seed">种子</label>
          <input id="validator-seed" type="text" inputmode="numeric" placeholder="例如 424242">
          <small>使用十进制非负整数。当前后端实际发的是 32 位无符号整数。</small>
        </div>

        <div class="validator-field">
          <label>验证类型</label>
          <div class="validator-view-switch" role="group" aria-label="验证类型切换">
            <button class="validator-pill" type="button" data-validator-view="initial" aria-pressed="true">起手盘</button>
            <button class="validator-pill" type="button" data-validator-view="next" aria-pressed="false">下一块</button>
            <button class="validator-pill" type="button" data-validator-view="directions" aria-pressed="false">四方向</button>
          </div>
        </div>

        <div id="validator-board-section">
          <div class="validator-field">
            <label for="validator-step-count">stepCount</label>
            <input id="validator-step-count" type="number" min="0" step="1" value="7">
            <small>这里填这次 spawn 对应的 deterministic 步数。对起手两块来说分别是 0 和 1。</small>
          </div>

          <div class="validator-field">
            <label for="validator-board">当前棋盘 JSON</label>
            <textarea id="validator-board" spellcheck="false"></textarea>
            <small>填“当前这一步准备出块之前”的棋盘矩阵。</small>
          </div>
        </div>

        <div class="validator-actions">
          <button class="validator-btn validator-btn-secondary" id="validator-example" type="button">填充样例</button>
          <button class="validator-btn validator-btn-primary" id="validator-run" type="button">开始验证</button>
        </div>

        <div class="validator-status" id="validator-status" data-status-kind="info"></div>
      </section>

      <section class="validator-panel">
        <h2>结果</h2>
        <div class="validator-result-meta" id="validator-result-meta"></div>
        <div class="validator-result-boards" id="validator-result-boards"></div>
        <pre class="validator-result-json" id="validator-result-json"></pre>
      </section>
    </div>
  </main>

  <script src="./js/mode_catalog.js"></script>
  <script type="module" src="./src/entries/ranked-seed-validator.js"></script>
</body>
</html>
