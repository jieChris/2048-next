<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 Password Center</title>
  <link href="style/main.css?v=20260327-01" rel="stylesheet" type="text/css">
  <link href="style/palette_page.css?v=20260310-01" rel="stylesheet" type="text/css">
  <link href="style/account_page.css?v=20260321-01" rel="stylesheet" type="text/css">
  <link href="style/password_page.css?v=20260321-01" rel="stylesheet" type="text/css">
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260305-2">
  <link rel="shortcut icon" href="meta/favicon.svg?v=20260305-2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="turnstile-site-key" content="0x4AAAAAACuEcCjf-_Mtr_HS">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://taihe.fun https://www.taihe.fun; img-src 'self' data:; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; frame-src https://challenges.cloudflare.com;">
</head>
<body data-page="password-hub" data-i18n-ready="0">
  <main class="palette-page-shell password-page-shell">
    <header class="palette-page-header">
      <div class="palette-title-wrap">
        <p class="palette-kicker" id="password-kicker">2048 Online Hub</p>
        <h1 class="palette-title" id="password-title">Password Center</h1>
        <p class="palette-subtitle" id="password-subtitle">Reset forgotten passwords or change your current password securely.</p>
      </div>
      <nav class="palette-nav">
        <a class="replay-button palette-nav-btn" href="account.html" id="password-nav-login">Back to Login</a>
        <a class="replay-button palette-nav-btn" href="2048.html" id="password-nav-home">Home</a>
      </nav>
    </header>

    <section class="card-surface password-card">
      <div class="panel-head">
        <h2 id="password-heading">Password Operations</h2>
      </div>

      <section id="password-reset-section" class="password-section">
        <h3 id="password-reset-heading">Forgot Password</h3>
        <div class="account-auth-grid password-auth-grid">
          <label for="password-reset-email" id="password-reset-email-label">Email</label>
          <input id="password-reset-email" class="account-input" type="email" placeholder="Enter email">

          <label id="password-reset-turnstile-label">Human Verification</label>
          <div id="password-reset-turnstile-wrap" class="password-turnstile-wrap">
            <div id="password-reset-turnstile-widget"></div>
          </div>

          <label for="password-reset-code" id="password-reset-code-label">Email Verification Code</label>
          <input id="password-reset-code" class="account-input" type="text" maxlength="6" autocomplete="one-time-code" placeholder="Enter code from email">

          <label for="password-reset-new-password" id="password-reset-new-password-label">New Password</label>
          <input id="password-reset-new-password" class="account-input" type="password" placeholder="Enter new password">
        </div>
        <div class="account-action-row password-action-row">
          <button id="password-reset-send-code-btn" class="replay-button" type="button">Send Code</button>
          <button id="password-reset-submit-btn" class="replay-button" type="button">Reset Password</button>
        </div>
      </section>

      <section id="password-change-section" class="password-section password-change-section">
        <h3 id="password-change-heading">Change Password (Logged In)</h3>
        <div class="account-auth-grid password-auth-grid">
          <label for="password-change-old-password" id="password-change-old-password-label">Current Password</label>
          <input id="password-change-old-password" class="account-input" type="password" placeholder="Enter current password">

          <label for="password-change-new-password" id="password-change-new-password-label">New Password</label>
          <input id="password-change-new-password" class="account-input" type="password" placeholder="Enter new password">
        </div>
        <div class="account-action-row password-action-row">
          <button id="password-change-submit-btn" class="replay-button" type="button">Change Password</button>
        </div>
      </section>

      <p id="password-tip" class="account-tip" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script type="module" src="./src/entries/password.ts"></script>
</body>
</html>
