<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 密码中心</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260606-fillframe">
  <link rel="icon" type="image/x-icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="shortcut icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png?v=20260606-fillframe">
  <link rel="manifest" href="site.webmanifest?v=20260606-fillframe">
  <script src="/js/core_night_mode_preload.js?v=20260418-01"></script>
  <script src="/js/beta_access_preload.js?v=20260627-01"></script>
  <link href="style/main.css?v=20260608-toolkit-align" rel="stylesheet" type="text/css">
  <link href="style/palette_page.css?v=20260310-01" rel="stylesheet" type="text/css">
  <link href="style/account_page.css?v=20260321-01" rel="stylesheet" type="text/css">
  <link href="style/password_page.css?v=20260321-01" rel="stylesheet" type="text/css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://2048next.cn https://www.2048next.cn; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';">
</head>
<body data-page="password-hub" data-i18n-ready="0">
  <main class="palette-page-shell password-page-shell">
    <header class="palette-page-header">
      <div class="palette-title-wrap">
        <p class="palette-kicker" id="password-kicker">2048 在线中心</p>
        <h1 class="palette-title" id="password-title">密码中心</h1>
        <p class="palette-subtitle" id="password-subtitle">可安全重置忘记的密码，或修改当前账号密码。</p>
      </div>
      <nav class="palette-nav">
        <a class="replay-button palette-nav-btn" href="account.html" id="password-nav-login">返回登录</a>
        <a class="replay-button palette-nav-btn" href="2048.html" id="password-nav-home">首页</a>
      </nav>
    </header>

    <section class="card-surface password-card">
      <div class="panel-head">
        <h2 id="password-heading">密码操作</h2>
      </div>

      <section id="password-reset-section" class="password-section">
        <h3 id="password-reset-heading">忘记密码</h3>
        <div class="account-auth-grid password-auth-grid">
          <label for="password-reset-email" id="password-reset-email-label">邮箱</label>
          <input id="password-reset-email" class="account-input" type="email" placeholder="请输入邮箱">

          <label id="password-reset-turnstile-label">人机验证</label>
          <div id="password-reset-turnstile-wrap" class="password-turnstile-wrap">
            <div id="password-reset-turnstile-widget"></div>
          </div>

          <label for="password-reset-code" id="password-reset-code-label">邮箱验证码</label>
          <input id="password-reset-code" class="account-input" type="text" maxlength="6" autocomplete="one-time-code" placeholder="请输入邮箱中的验证码">

          <label for="password-reset-new-password" id="password-reset-new-password-label">新密码</label>
          <input id="password-reset-new-password" class="account-input" type="password" placeholder="请输入新密码">
        </div>
        <div class="account-action-row password-action-row">
          <button id="password-reset-send-code-btn" class="replay-button" type="button">发送验证码</button>
          <button id="password-reset-submit-btn" class="replay-button" type="button">重置密码</button>
        </div>
      </section>

      <section id="password-change-section" class="password-section password-change-section">
        <h3 id="password-change-heading">修改密码（已登录）</h3>
        <div class="account-auth-grid password-auth-grid">
          <label for="password-change-old-password" id="password-change-old-password-label">当前密码</label>
          <input id="password-change-old-password" class="account-input" type="password" placeholder="请输入当前密码">

          <label for="password-change-new-password" id="password-change-new-password-label">新密码</label>
          <input id="password-change-new-password" class="account-input" type="password" placeholder="请输入新密码">
        </div>
        <div class="account-action-row password-action-row">
          <button id="password-change-submit-btn" class="replay-button" type="button">修改密码</button>
        </div>
      </section>

      <p id="password-tip" class="account-tip" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./src/entries/password.ts"></script>
</body>
</html>
