<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 设置</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260606-fillframe">
  <link rel="icon" type="image/x-icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="shortcut icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png?v=20260704-png-opt">
  <link rel="manifest" href="/site.webmanifest?v=20260704-pwa-icons">
  <script src="/js/core_night_mode_preload.js?v=20260722-default-appearance-v1"></script>
  <script src="/js/beta_access_preload.js?v=20260708-01"></script>
  <link href="style/main.css?v=20260722-board-parity-v2" rel="stylesheet" type="text/css">
  <link href="style/palette_page.css?v=20260722-theme-sidebar-v8" rel="stylesheet" type="text/css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
</head>
<body data-page="palette-hub">
  <main class="palette-page-shell">
    <header class="palette-page-header">
      <div class="palette-title-wrap palette-nav">
        <a class="palette-nav-btn page-back-button" href="2048.html">回首页</a>
        <div class="page-title-visually-hidden">
          <p class="palette-kicker">2048 设置</p>
          <h1 class="palette-title">设置</h1>
          <p class="palette-subtitle">集中管理计时器、主题与色板，相关选项按类别收纳。</p>
        </div>
      </div>
      <nav class="palette-nav">
        <a class="replay-button palette-nav-btn" href="Practice_board.html">练习板</a>
        <a class="replay-button palette-nav-btn palette-touch-entry" href="touch_sensitivity.html">触屏灵敏度</a>
      </nav>
    </header>

    <nav class="settings-category-nav" aria-label="设置分类">
      <a class="settings-category-link is-active" href="#timer-settings" aria-controls="timer-settings" aria-current="page">
        <strong>计时器</strong>
        <span>自定义子计时器规则</span>
      </a>
      <a class="settings-category-link" href="#appearance-settings" aria-controls="appearance-settings">
        <strong>外观与配色</strong>
        <span>主题、色板与棋盘预览</span>
      </a>
    </nav>

    <section id="timer-settings" class="card-surface palette-settings-card">
      <div class="panel-head">
        <h2>计时器设置</h2>
        <span class="panel-pill">计时</span>
      </div>
      <details id="custom-secondary-timer-editor" class="settings-disclosure">
        <summary>
          <span class="settings-disclosure-copy">
            <strong>自定义子计时器</strong>
            <small>按规则体系保存，每行填写一条完整规则。</small>
          </span>
          <span class="settings-disclosure-action settings-disclosure-open">展开设置</span>
          <span class="settings-disclosure-action settings-disclosure-close">收起设置</span>
        </summary>
        <div class="custom-secondary-timer-body">
          <div class="custom-secondary-timer-family-tabs" role="tablist" aria-label="子计时器规则体系">
            <button type="button" class="custom-secondary-timer-family-btn is-active" data-timer-family="pow2" role="tab" aria-selected="true">2048</button>
            <button type="button" class="custom-secondary-timer-family-btn" data-timer-family="fibonacci" role="tab" aria-selected="false">Fibonacci</button>
          </div>
          <div class="custom-secondary-timer-generator">
            <label>
              <span class="custom-secondary-timer-range-start-label">起始母计时器</span>
              <select id="custom-secondary-timer-range-start"></select>
            </label>
            <label>
              <span class="custom-secondary-timer-range-end-label">结束母计时器</span>
              <select id="custom-secondary-timer-range-end"></select>
            </label>
            <button id="custom-secondary-timer-generate" class="replay-button" type="button">生成推荐规则</button>
          </div>
          <p class="custom-secondary-timer-generator-hint">生成结果会替换规则内容；点击保存前不会生效。</p>
          <label for="custom-secondary-timer-rules" class="custom-secondary-timer-label">规则内容</label>
          <p id="custom-secondary-timer-family" class="custom-secondary-timer-desc">2 的幂模式共享；每行一条完整规则。</p>
          <textarea id="custom-secondary-timer-rules" rows="8" spellcheck="false" placeholder="32&#10;32+2&#10;32+4"></textarea>
          <div class="custom-secondary-timer-actions">
            <button id="custom-secondary-timer-save" class="replay-button" type="button">保存规则</button>
            <button id="custom-secondary-timer-clear" class="replay-button" type="button">清空</button>
          </div>
          <p id="custom-secondary-timer-note" class="palette-note" aria-live="polite"></p>
        </div>
      </details>
    </section>

    <section id="appearance-settings" class="palette-settings-section" hidden>
    <section class="palette-grid">
      <aside class="palette-sidebar card-surface">
        <div class="theme-selection-col palette-sidebar-theme">
          <label>选择主题</label>
          <div class="custom-select-wrapper">
            <div class="custom-select">
              <div class="custom-select-trigger" id="theme-select-trigger">
                <span>雾青灰</span>
                <div class="custom-arrow"></div>
              </div>
              <div class="custom-select-options" id="theme-select-options"></div>
            </div>
          </div>
          <select id="theme-select" style="display:none"></select>
          <p class="palette-variant-note">色板颜色会按方块等级映射到其他棋盘变体。</p>
          <div id="theme-preview-grid" hidden aria-hidden="true"></div>
        </div>

        <div class="panel-head">
          <h2>色板</h2>
          <span id="palette-count" class="panel-pill">0</span>
        </div>
        <div id="palette-list" class="palette-list" aria-label="色板列表"></div>
      </aside>

      <section class="palette-editor card-surface">
        <div class="palette-toolbar">
          <input id="palette-name-input" class="palette-name-input" type="text" maxlength="40" placeholder="输入当前主题体名称（可编辑）">
          <button id="palette-create-btn" class="replay-button" type="button">新建副本</button>
          <button id="palette-rename-btn" class="replay-button" type="button">重命名</button>
          <button id="palette-delete-btn" class="replay-button" type="button">删除</button>
          <button id="palette-export-btn" class="replay-button" type="button">导出</button>
          <button id="palette-import-btn" class="replay-button" type="button">导入</button>
          <input id="palette-import-input" type="file" accept="application/json" hidden>
        </div>

        <div id="palette-dimension-tabs" class="palette-dimension-tabs" role="tablist" aria-label="颜色维度">
          <button type="button" class="palette-dimension-tab is-active" data-dimension="background">背景</button>
          <button type="button" class="palette-dimension-tab" data-dimension="text">文字</button>
          <button type="button" class="palette-dimension-tab" data-dimension="border">边框</button>
          <button type="button" class="palette-dimension-tab" data-dimension="glow">发光</button>
        </div>

        <section class="color-panel">
          <div class="color-panel-head">
            <span id="palette-editor-panel-head">背景颜色</span>
            <p id="palette-note" class="palette-note" aria-live="polite"></p>
          </div>
          <div class="editor-workspace">
            <div class="editor-targets">
              <div id="palette-editor-current" class="color-grid color-grid-targets"></div>
            </div>
            <aside id="palette-swatch-popover" class="editor-palette editor-palette-popover">
              <div class="editor-palette-tile">
                <span id="palette-swatch-tile" class="swatch-tile-chip"></span>
                <span id="palette-swatch-value" class="swatch-tile-value">2</span>
              </div>
              <div class="editor-palette-main">
                <div class="editor-picker-left">
                  <div id="palette-picker-sv" class="picker-sv">
                    <span id="palette-picker-cursor" class="picker-sv-cursor"></span>
                  </div>
                  <div class="picker-controls-row">
                    <span id="palette-picker-current" class="picker-current-dot"></span>
                    <input id="palette-picker-hue" class="picker-hue" type="range" min="0" max="360" step="1" value="45">
                  </div>
                  <div class="picker-rgb-row">
                    <label>
                      <input id="palette-picker-r" type="number" min="0" max="255" step="1" value="237">
                      <span>R</span>
                    </label>
                    <label>
                      <input id="palette-picker-g" type="number" min="0" max="255" step="1" value="194">
                      <span>G</span>
                    </label>
                    <label>
                      <input id="palette-picker-b" type="number" min="0" max="255" step="1" value="46">
                      <span>B</span>
                    </label>
                  </div>
                </div>
                <div class="editor-presets-right">
                  <div class="editor-palette-head">预设颜色</div>
                  <div id="palette-swatch-grid" class="swatch-grid swatch-grid-presets"></div>
                </div>
              </div>
            </aside>
          </div>
        </section>

        <section class="preview-panel">
          <div id="palette-preview-panel-head" class="color-panel-head">颜色预览</div>
          <div class="preview-layout">
            <div class="preview-board-wrap">
              <div id="palette-preview-board" class="game-container palette-board-preview"></div>
            </div>
          </div>
        </section>

        <div class="legacy-hooks" hidden aria-hidden="true">
          <div id="palette-editor-pow2"></div>
          <div id="palette-editor-fib"></div>
          <div id="palette-preview-pow2"></div>
          <div id="palette-preview-fib"></div>
        </div>

      </section>
    </section>
    </section>
  </main>

  <script type="module" src="./src/entries/palette.ts"></script>
</body>
</html>
