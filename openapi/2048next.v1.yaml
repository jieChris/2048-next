          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeepSeekIntegrationState"
        "403": { $ref: "#/components/responses/NoStoreApiErrorResponse" }

