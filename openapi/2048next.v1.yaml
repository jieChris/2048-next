      description: Requires super administrator permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AchievementCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AchievementResponse"

  /admin/achievements/{achievementId}:
    patch:
      tags: [Admin, Achievements]
      summary: Update an achievement definition.
      description: Requires super administrator permission.
      parameters:
        - $ref: "#/components/parameters/AchievementIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AchievementUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/AchievementResponse"

  /admin/achievements/{achievementId}/icon:
    post:
      tags: [Admin, Achievements]
      summary: Upload an achievement icon.
      description: Requires super administrator permission.
      parameters:
        - $ref: "#/components/parameters/AchievementIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [icon]
              properties:
                icon:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/AchievementResponse"

  /admin/achievements/{achievementId}/rules:
    post:
      tags: [Admin, Achievements]
      summary: Replace achievement unlock rules.
      description: Requires super administrator permission.
      parameters:
        - $ref: "#/components/parameters/AchievementIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rules]
              properties:
                rules:
                  type: array
                  items:
                    $ref: "#/components/schemas/AchievementRule"
      responses:
        "200":
          $ref: "#/components/responses/AchievementResponse"

  /admin/achievements/grant:
    post:
      tags: [Admin, Achievements]
      summary: Manually grant an achievement to a user.
      description: Requires super administrator permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AchievementGrantRequest"
      responses:
        "200":
          description: Granted user achievement.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserAchievement"

  /admin/achievements/backfill:
    post:
      tags: [Admin, Achievements]
      summary: Recalculate achievements from existing verified records.
      description: Requires super administrator permission and must be idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_id:
                  type: integer
                  minimum: 1
                achievement_id:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AdminUserIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    AdminRecordIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    AvatarSubmissionIdPath:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModerationSubmissionIdPath:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    ProfileBackgroundSceneIdPath:
      name: sceneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'
    AppPaletteFormatHeader:
      name: X-2048-Palette-Format
      in: header
      required: false
      description: Request format 3 from compatible clients; omitted clients receive the format-2 projection.
      schema:
        type: integer
        enum: [2, 3]
    ThemePlazaListingIdPath:
      name: listingId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ThemePlazaVersionIdPath:
      name: versionId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RecordIdPath:
      name: recordId
      in: path
      required: true
      schema:
        type: string
    RecordUploadTaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    ClientVersionHeader:
      name: X-Client-Version
      in: header
      required: false
      schema:
        type: string
        maxLength: 80
    RecordModeKeyHeader:
      name: X-Record-Mode-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 160
    ClientRecordIdHeader:
      name: X-Client-Record-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 160
    RecordDeliverySourceHeader:
      name: X-Record-Delivery-Source
      in: header
      required: false
      schema:
        type: string
        enum: [automatic, manual]
    OfferIdPath:
      name: offerId
      in: path
      required: true
      schema:
        type: string
    AchievementIdPath:
      name: achievementId
      in: path
      required: true
      schema:
        type: string
    RelayCaseIdPath:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 10
    NicknameQuery:
      name: nickname
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32

  headers:
    NoStore:
      description: Sensitive responses must not be stored by clients or intermediaries.
      schema:
        type: string
        const: no-store

  responses:
    ApiErrorResponse:
      description: Machine-readable API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NoStoreApiErrorResponse:
      description: Non-cacheable machine-readable API error.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ApiEnvelopeResponse:
      description: Generic API envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelope"
    AuthResponse:
      description: Authenticated user and token.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: integer
                  ttl:
                    type: integer
                  user:
                    $ref: "#/components/schemas/User"
    UserResponse:
      description: User profile result.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  data:
                    $ref: "#/components/schemas/User"
    PublicUserProfileResponse:
      description: Public allowlisted player profile.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublicUserProfile"
    UserProfileSnapshotResponse:
      description: Updated public profile snapshot.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfileSnapshot"
    ProfileBackgroundSceneResponse:
      description: Background scene mutation result.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/ProfileBackgroundScene" }
    ProfileBackgroundDefaultUpdateResponse:
      description: Custom or built-in default background selection.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/ProfileBackgroundScene"
                      - $ref: "#/components/schemas/ProfileBackgroundBuiltInDefault"
    UserProfileUpdateConflictResponse:
      description: Revision, active moderation, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileUpdateConflictError"
    UserProfileUpdateRateLimitResponse:
      description: Bio submission quota or temporary block deadline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileUpdateRateLimitError"
    AchievementResponse:
      description: Achievement definition result.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiEnvelope"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Achievement"

  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [success, error, code, reason_code]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
        reason_code:
          type: string
          enum:
            - unauthorized
            - forbidden
            - validation_error
            - revision_conflict
            - idempotency_conflict
            - rate_limited
            - bio_temporarily_blocked
            - content_review_pending
            - content_rejected
            - provider_unavailable
            - not_found
        detail:
          type: string

    ApiEnvelope:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        error:
          type: string
        code:
          type: string
        reason_code:
          type: string
        message:
          type: string

    AppPaletteColor:
      type: string
      pattern: '^(?:#[0-9A-Fa-f]{6}|transparent)$'

    AppPaletteProfile:
      type: object
      additionalProperties: true
      required: [id, name, baseSkin, colors]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 20
        baseSkin:
          type: string
          enum: [precision, web, ink, dango]
        colors:
          type: object
          additionalProperties:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
        pow2:
          type: array
          minItems: 26
          maxItems: 26
          items: { type: string }
        fibonacci:
          type: array
          minItems: 16
          maxItems: 16
          items: { type: string }
        pow2Text:
          type: array
          minItems: 26
          maxItems: 26
          items: { type: string }
        fibonacciText:
          type: array
          minItems: 16
          maxItems: 16
          items: { type: string }
        pow2Border:
          type: array
          minItems: 26
          maxItems: 26
          items: { $ref: "#/components/schemas/AppPaletteColor" }
        fibonacciBorder:
          type: array
          minItems: 16
          maxItems: 16
          items: { $ref: "#/components/schemas/AppPaletteColor" }
        pow2Glow:
          type: array
          minItems: 26
          maxItems: 26
          items: { $ref: "#/components/schemas/AppPaletteColor" }
        fibonacciGlow:
          type: array
          minItems: 16
          maxItems: 16
          items: { $ref: "#/components/schemas/AppPaletteColor" }
        glowIntensity:
          type: integer
          minimum: 0
          maximum: 100
        glowMultipliers:
          type: array
          minItems: 26
          maxItems: 26
          items:
            type: integer
            minimum: 0
            maximum: 200
        createdAt: { type: integer, minimum: 0 }
        updatedAt: { type: integer, minimum: 0 }

    AppPaletteDocument:
      type: object
      additionalProperties: true
      required: [schema, format, activePaletteId, palettes]
      properties:
        schema: { type: integer, const: 1 }
        format: { type: integer, enum: [2, 3] }
        activePaletteId: { type: [string, "null"] }
        palettes:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AppPaletteProfile" }

    AppPaletteRemoteState:
      type: object
      additionalProperties: false
      required: [document, revision, updatedAt, supportedFormats, sourceFormat]
      properties:
        document: { $ref: "#/components/schemas/AppPaletteDocument" }
        revision: { type: integer, minimum: 0 }
        updatedAt: { type: [string, "null"], format: date-time }
        supportedFormats:
          type: array
          uniqueItems: true
          items: { type: integer, enum: [2, 3] }
        sourceFormat:
          type: integer
          enum: [2, 3]
          description: Stored document format before response projection; format-3 clients use 2 to safely upgrade matching legacy rows.

    AppPalettePutRequest:
      type: object
      additionalProperties: false
      required: [baseRevision, document]
      properties:
        baseRevision: { type: integer, minimum: 0 }
        document: { $ref: "#/components/schemas/AppPaletteDocument" }

    AppPaletteResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, data]
          properties:
            success: { type: boolean }
            data: { $ref: "#/components/schemas/AppPaletteRemoteState" }

    ThemePlazaCapabilities:
      type: object
      additionalProperties: false
      required: [readEnabled, writeEnabled, autoPublishEnabled, paletteFormat3Enabled]
      properties:
        readEnabled: { type: boolean }
        writeEnabled: { type: boolean }
        autoPublishEnabled: { type: boolean }
        paletteFormat3Enabled: { type: boolean }

    ThemePlazaListing:
      type: object
      additionalProperties: false
      required: [id, version, author, stats, viewer]
      properties:
        id: { type: integer, minimum: 1 }
        version:
          type: object
          required: [id, revision, title, palette, publishedAt]
          properties:
            id: { type: integer, minimum: 1 }
            revision: { type: integer, minimum: 1 }
            title: { type: string, minLength: 2, maxLength: 20 }
            palette: { $ref: "#/components/schemas/AppPaletteProfile" }
            publishedAt: { type: string, format: date-time }
        author:
          type: object
          required: [nickname, publicProfileId]
          properties:
            nickname: { type: string }
            publicProfileId: { type: [integer, "null"] }
        stats:
          type: object
          required: [likes, dislikes, references]
          properties:
            likes: { type: integer, minimum: 0 }
            dislikes: { type: integer, minimum: 0 }
            references: { type: integer, minimum: 0 }
        viewer:
          type: object
          required: [vote, saved, owned]
          properties:
            vote: { type: integer, enum: [-1, 0, 1] }
            saved: { type: boolean }
            owned: { type: boolean }

    ThemePlazaListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, data, nextCursor, capabilities]
          properties:
            success: { type: boolean, const: true }
            data: { type: array, items: { $ref: "#/components/schemas/ThemePlazaListing" } }
            nextCursor: { type: [string, "null"] }
            capabilities: { $ref: "#/components/schemas/ThemePlazaCapabilities" }

    ThemePlazaDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, data, capabilities]
          properties:
            success: { type: boolean, const: true }
            data: { $ref: "#/components/schemas/ThemePlazaListing" }
            capabilities: { $ref: "#/components/schemas/ThemePlazaCapabilities" }

    ThemePlazaSubmissionRequest:
      type: object
      additionalProperties: false
      required: [palette_id, title, revision]
      properties:
        palette_id: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, minLength: 2, maxLength: 20 }
        revision: { type: integer, minimum: 0 }

    ThemePlazaVoteRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: integer, enum: [-1, 0, 1] }

    ThemePlazaSaveRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }

    ThemePlazaReportRequest:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category:
          type: string
          enum: [impersonation, advertising, harassment, hate, sexual, violence, illegal, copyright, other]
        note: { type: string, maxLength: 200 }

    AdminReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    AdminRecordImportRequest:
      type: object
      additionalProperties: false
      required: [replay_string, reason]
      properties:
        replay_string:
          type: string
        mode_key:
          type: string
        client_record_id:
          type: string
          maxLength: 160
        ended_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500

    RecordUploadCreateRequest:
      type: object
      additionalProperties: false
      required: [client_record_id, mode_key, replay_sha256, replay_byte_size, chunk_size]
      properties:
        client_record_id:
          type: string
          minLength: 1
          maxLength: 160
        mode_key:
          type: string
          minLength: 1
        replay_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        replay_byte_size:
          type: integer
          minimum: 1
          maximum: 536870912
        chunk_size:
          type: integer
          minimum: 65536
          maximum: 1048576

    RecordUploadTask:
      type: object
      additionalProperties: false
      properties:
        upload_task_id:
          type: [string, "null"]
        client_record_id:
          type: string
        mode_key:
          type: string
        replay_sha256:
          type: string
        replay_byte_size:
          type: integer
        chunk_size:
          type: integer
        chunk_count:
          type: integer
        received_chunks:
          type: array
          items: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [created, uploading, completed, failed, expired]
        server_record_id:
          type: [string, "null"]
        last_error_code:
          type: [string, "null"]
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time

    User:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        user_id:
          type: integer
        game_user_id:
          type: [integer, "null"]
          minimum: 0
        gameUserId:
          type: [integer, "null"]
          minimum: 0
        public_profile_id:
          type: [integer, "null"]
          minimum: 0
        publicProfileId:
          type: [integer, "null"]
          minimum: 0
        nickname:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        profile_bio:
          type: string
          maxLength: 150
          description: Public approved bio. Empty during P0a until bio review is enabled.
        profileBio:
          type: string
          maxLength: 150
          description: Camel-case compatibility alias for profile_bio.
        background_scene_id:
          $ref: "#/components/schemas/ProfileBackgroundSceneReference"
          description: Published profile background scene or the built-in default.
        backgroundSceneId:
          $ref: "#/components/schemas/ProfileBackgroundSceneReference"
          description: Camel-case compatibility alias for background_scene_id.
        featured_mode_keys:
          type: array
          maxItems: 3
          items:
            type: string
        featuredModeKeys:
          type: array
          maxItems: 3
          items:
            type: string
        created_at:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 0
        admin:
          type: boolean
        super_admin:
          type: boolean

    UserProfileUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [revision]
      anyOf:
        - required: [background_scene_id]
        - required: [featured_mode_keys]
        - required: [profile_bio]
      properties:
        profile_bio:
          type: string
          maxLength: 150
          description: Submitted for moderation; the prior approved bio remains public until approval.
        background_scene_id:
          $ref: "#/components/schemas/ProfileBackgroundSceneReference"
          description: A published complete scene or the built-in default.
        featured_mode_keys:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
        revision:
          type: integer
          minimum: 0

    PublicUserProfile:
      type: object
      additionalProperties: false
      required: [id, nickname, avatar_url, profile_bio, background_scene_id, featured_mode_keys, revision]
      properties:
        id:
          type: integer
          minimum: 0
        nickname:
          type: string
        avatar_url:
          type: string
        profile_bio:
          type: string
          maxLength: 150
        background_scene_id:
          $ref: "#/components/schemas/ProfileBackgroundSceneReference"
        featured_mode_keys:
          type: array
          maxItems: 3
          items:
            type: string
        created_at:
          type: [string, "null"]
          format: date-time
          description: Null when no account-registration timestamp is available.
        revision:
          type: integer
          minimum: 0

    UserProfileSnapshot:
      type: object
      additionalProperties: false
      required: [user_id, profile_bio, background_scene_id, featured_mode_keys, revision]
      properties:
        user_id:
          type: integer
          minimum: 0
        profile_bio:
          type: string
          maxLength: 150
        background_scene_id:
          $ref: "#/components/schemas/ProfileBackgroundSceneReference"
        featured_mode_keys:
          type: array
          maxItems: 3
          items:
            type: string
        revision:
          type: integer
          minimum: 0
        moderation_submission:
          oneOf:
            - $ref: "#/components/schemas/ModerationSubmissionSummary"
            - type: "null"
        moderation_queue:
          oneOf:
            - $ref: "#/components/schemas/ModerationQueueStatus"
            - type: "null"

    UserProfileConflictSnapshot:
      type: object
      additionalProperties: false
      required: [profile_bio, background_scene_id, featured_mode_keys, revision]
      properties:
        profile_bio:
          type: string
          maxLength: 150
        background_scene_id:
          $ref: "#/components/schemas/ProfileBackgroundSceneReference"
        featured_mode_keys:
          type: array
          maxItems: 3
          items:
            type: string
        revision:
          type: integer
          minimum: 0

    ProfileContentReviewPendingData:
      type: object
      additionalProperties: false
      required: [submission_id, status, same_content]
      properties:
        submission_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [submitted, ai_reviewing, ai_pass, manual_review, failed_retryable]
        same_content:
          type: boolean

    ProfileUpdateConflictError:
      oneOf:
        - type: object
          additionalProperties: false
          required: [success, error, code, reason_code, data]
          properties:
            success: { type: boolean, const: false }
            error: { type: string }
            code: { type: string, const: PROFILE_REVISION_CONFLICT }
            reason_code: { type: string, const: revision_conflict }
            data: { $ref: "#/components/schemas/UserProfileConflictSnapshot" }
        - type: object
          additionalProperties: false
          required: [success, error, code, reason_code, data]
          properties:
            success: { type: boolean, const: false }
            error: { type: string }
            code: { type: string, const: CONTENT_REVIEW_PENDING }
            reason_code: { type: string, const: content_review_pending }
            data: { $ref: "#/components/schemas/ProfileContentReviewPendingData" }
        - type: object
          additionalProperties: false
          required: [success, error, code, reason_code]
          properties:
            success: { type: boolean, const: false }
            error: { type: string }
            code: { type: string, const: IDEMPOTENCY_KEY_CONFLICT }
            reason_code: { type: string, const: idempotency_conflict }
        - type: object
