    put:
      tags: [Admin]
      summary: Configure or rotate the encrypted DeepSeek API key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeepSeekKeyUpdateRequest"
      responses:
        "200":
          description: Masked active integration state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DeepSeekIntegrationState" }
        "400": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "403": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "409": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "503": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
    delete:
      tags: [Admin]
      summary: Disable and cryptographically erase the active local DeepSeek key material.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationStepUpRequest"
      responses:
        "200":
          description: Disabled DeepSeek integration state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DeepSeekDisableResult" }
        "400": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "403": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "409": { $ref: "#/components/responses/NoStoreApiErrorResponse" }

  /admin/integrations/deepseek/test:
    post:
      tags: [Admin]
      summary: Test DeepSeek using fixed synthetic content only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationStepUpRequest"
      responses:
        "200":
          description: Successful synthetic DeepSeek connection test.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DeepSeekConnectionTestSuccess" }
        "202":
          description: An idempotent connection test is already in progress.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: "#/components/schemas/DeepSeekConnectionTestPending" }
        "400": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "403": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "409": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "503":
          description: Failed replay result or a fresh connection-test error.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeepSeekConnectionTestFailureEnvelope"
                  - $ref: "#/components/schemas/ApiError"

