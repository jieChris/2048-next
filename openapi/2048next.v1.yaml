openapi: 3.1.0
info:
  title: 2048 Next API
  version: 1.0.0
  summary: Versioned API contract for 2048 Next.
  description: >
    Source-controlled API contract for the current game, account, leaderboard,
    ranked session, rescue, admin, and planned achievement endpoints.
servers:
  - url: /api
    description: Same-origin API proxy.
  - url: https://2048next.cn/api
    description: Production API.
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Leaderboard
  - name: Records
  - name: Ranked
  - name: Relay
  - name: Rescue
  - name: Admin
  - name: Achievements
  - name: Palettes
  - name: Theme Plaza
paths:
  /register:
    post:
      tags: [Auth]
      summary: Register a new user with nickname and credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registration result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: "#/components/schemas/User"

  /register/check-nickname:
    get:
      tags: [Auth]
      summary: Check nickname availability.
      security: []
      parameters:
        - $ref: "#/components/parameters/NicknameQuery"
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /register/start:
    post:
      tags: [Auth]
      summary: Start an email verification registration flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStartRequest"
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /register/verify:
    post:
      tags: [Auth]
      summary: Complete registration with verification code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthResponse"

  /login:
    post:
      tags: [Auth]
      summary: Login with account credentials.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthResponse"

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current browser device session and clear its cookies.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Restore a short-lived access token from the persistent HttpOnly device session.
      security: []
      responses:
        "200":
          $ref: "#/components/responses/AuthResponse"
        "401":
          $ref: "#/components/responses/ApiEnvelopeResponse"
        "503":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /login/captcha:
    post:
      tags: [Auth]
      summary: Request a login captcha when required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nickname:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /password/change:
    post:
      tags: [Auth]
      summary: Change password for the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /password/reset/start:
    post:
      tags: [Auth]
      summary: Start password reset flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /password/reset/verify:
    post:
      tags: [Auth]
      summary: Complete password reset with verification code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code, password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                password:
                  type: string
                  minLength: 6
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /me:
    get:
      tags: [Users]
      summary: Legacy alias for the authenticated user profile.
      deprecated: true
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"

  /me/app-palettes:
    get:
      tags: [Palettes]
      summary: Read the authenticated account palette document with negotiated format projection.
      parameters:
        - $ref: "#/components/parameters/AppPaletteFormatHeader"
      responses:
        "200":
          description: Current palette document, compare-and-swap revision, and supported formats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPaletteResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiErrorResponse"
    put:
      tags: [Palettes]
      summary: Compare-and-swap the authenticated account palette document.
      parameters:
        - $ref: "#/components/parameters/AppPaletteFormatHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppPalettePutRequest"
      responses:
        "200":
          description: Saved palette document and incremented revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPaletteResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          description: Palette revision conflict with the latest server document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPaletteResponse"

  /theme-plaza/capabilities:
    get:
      tags: [Theme Plaza]
      summary: Read Theme Plaza rollout capabilities.
      security: []
      responses:
        "200":
          description: Feature capability state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ThemePlazaCapabilities" }

  /theme-plaza:
    get:
      tags: [Theme Plaza]
      summary: Browse published palette versions with stable cursor pagination.
      security: []
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [latest, most_referenced, most_liked], default: latest }
        - name: query
          in: query
          schema: { type: string, maxLength: 50 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Published palette listing page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemePlazaListResponse" }
        "400": { $ref: "#/components/responses/ApiErrorResponse" }
        "503": { $ref: "#/components/responses/ApiErrorResponse" }

  /theme-plaza/{listingId}:
    get:
      tags: [Theme Plaza]
      summary: Read one published palette listing.
      security: []
      parameters:
        - $ref: "#/components/parameters/ThemePlazaListingIdPath"
      responses:
        "200":
          description: Published palette detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemePlazaDetailResponse" }
        "404": { $ref: "#/components/responses/ApiErrorResponse" }
        "503": { $ref: "#/components/responses/ApiErrorResponse" }

  /theme-plaza/me:
    get:
      tags: [Theme Plaza]
      summary: Read the authenticated author's listing slot and pending candidate.
      responses:
        "200": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "401": { $ref: "#/components/responses/ApiErrorResponse" }

  /theme-plaza/me/submissions:
    post:
      tags: [Theme Plaza]
      summary: Submit a server-owned account palette snapshot for asynchronous review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemePlazaSubmissionRequest" }
      responses:
        "202": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "400": { $ref: "#/components/responses/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/ApiErrorResponse" }
        "409": { $ref: "#/components/responses/ApiErrorResponse" }
        "503": { $ref: "#/components/responses/ApiErrorResponse" }

  /theme-plaza/me/submissions/{versionId}:
    delete:
      tags: [Theme Plaza]
      summary: Cancel the authenticated author's pending version.
      parameters:
        - $ref: "#/components/parameters/ThemePlazaVersionIdPath"
      responses:
        "200": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "404": { $ref: "#/components/responses/ApiErrorResponse" }
        "503": { $ref: "#/components/responses/ApiErrorResponse" }

  /theme-plaza/me/publication:
    delete:
      tags: [Theme Plaza]
      summary: Withdraw the authenticated author's current publication.
      responses:
        "200": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "404": { $ref: "#/components/responses/ApiErrorResponse" }
        "503": { $ref: "#/components/responses/ApiErrorResponse" }

  /theme-plaza/versions/{versionId}/vote:
    put:
      tags: [Theme Plaza]
      summary: Like, dislike, or clear the authenticated user's vote.
      parameters:
        - $ref: "#/components/parameters/ThemePlazaVersionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemePlazaVoteRequest" }
      responses:
        "200": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "403": { $ref: "#/components/responses/ApiErrorResponse" }
        "404": { $ref: "#/components/responses/ApiErrorResponse" }
        "503": { $ref: "#/components/responses/ApiErrorResponse" }

  /theme-plaza/versions/{versionId}/save:
    post:
      tags: [Theme Plaza]
      summary: Atomically save a private copy and record the first account reference.
      parameters:
        - $ref: "#/components/parameters/ThemePlazaVersionIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemePlazaSaveRequest" }
      responses:
        "200": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "403": { $ref: "#/components/responses/ApiErrorResponse" }
        "404": { $ref: "#/components/responses/ApiErrorResponse" }
        "409": { $ref: "#/components/responses/ApiErrorResponse" }
        "503": { $ref: "#/components/responses/ApiErrorResponse" }

  /theme-plaza/versions/{versionId}/reports:
    post:
      tags: [Theme Plaza]
      summary: Create or update one deduplicated report for a published version.
      parameters:
        - $ref: "#/components/parameters/ThemePlazaVersionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThemePlazaReportRequest" }
      responses:
        "200": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "403": { $ref: "#/components/responses/ApiErrorResponse" }
        "404": { $ref: "#/components/responses/ApiErrorResponse" }
        "503": { $ref: "#/components/responses/ApiErrorResponse" }

  /admin/theme-plaza/reviews:
    get:
      tags: [Admin, Theme Plaza]
      summary: List Theme Plaza review, publication, and report states.
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "403": { $ref: "#/components/responses/ApiErrorResponse" }

  /admin/theme-plaza/reviews/{versionId}:
    get:
      tags: [Admin, Theme Plaza]
      summary: Read one Theme Plaza candidate, reports, and moderation evidence.
      parameters:
        - $ref: "#/components/parameters/ThemePlazaVersionIdPath"
      responses:
        "200": { $ref: "#/components/responses/ApiEnvelopeResponse" }
        "404": { $ref: "#/components/responses/ApiErrorResponse" }

  /admin/theme-plaza/reviews/{versionId}/approve:
    post:
      tags: [Admin, Theme Plaza]
      summary: Approve one reviewed version and atomically publish it.
      parameters: [{ $ref: "#/components/parameters/ThemePlazaVersionIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminReasonRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ApiEnvelopeResponse" } }

  /admin/theme-plaza/reviews/{versionId}/reject:
    post:
      tags: [Admin, Theme Plaza]
      summary: Reject one reviewed version.
      parameters: [{ $ref: "#/components/parameters/ThemePlazaVersionIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminReasonRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ApiEnvelopeResponse" } }

  /admin/theme-plaza/reviews/{versionId}/retry-ai:
    post:
      tags: [Admin, Theme Plaza]
      summary: Requeue one version for AI review.
      parameters: [{ $ref: "#/components/parameters/ThemePlazaVersionIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminReasonRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ApiEnvelopeResponse" } }

  /admin/theme-plaza/versions/{versionId}/hide:
    post:
      tags: [Admin, Theme Plaza]
      summary: Hide one published version without deleting saved copies.
      parameters: [{ $ref: "#/components/parameters/ThemePlazaVersionIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminReasonRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ApiEnvelopeResponse" } }

  /admin/theme-plaza/versions/{versionId}/restore:
    post:
      tags: [Admin, Theme Plaza]
      summary: Restore one previously reviewed version.
      parameters: [{ $ref: "#/components/parameters/ThemePlazaVersionIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminReasonRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ApiEnvelopeResponse" } }

  /user/me:
    get:
      tags: [Users]
      summary: Get the authenticated user profile.
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"

  /user/me/profile:
    patch:
      tags: [Users]
      summary: Update the authenticated user's public profile.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/UserProfileSnapshotResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/UserProfileUpdateConflictResponse"
        "429":
          $ref: "#/components/responses/UserProfileUpdateRateLimitResponse"
        "503":
          $ref: "#/components/responses/ApiErrorResponse"

  /user/me/moderation-submissions:
    get:
      tags: [Users]
      summary: List the authenticated user's moderation status metadata without pending content.
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Moderation status history and current bio block deadline.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ModerationSubmissionSummary"
                      bio_blocked_until:
                        type: [string, "null"]
                        format: date-time
        "401":
          $ref: "#/components/responses/ApiErrorResponse"

  /user/me/avatar-submission:
    get:
      tags: [Users]
      summary: Read the authenticated user's latest avatar submission state.
      responses:
        "200":
          description: Avatar submission state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/AvatarSubmission"
                          - type: "null"
    post:
      tags: [Users]
      summary: Submit a JPEG, PNG, or WebP avatar for review.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Idempotent replay of the avatar submission.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AvatarSubmission" }
        "201":
          description: Avatar queued for review.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AvatarSubmission"

  /user/me/nickname:
    post:
      tags: [Users]
      summary: Update the authenticated user's nickname.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nickname]
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 32
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"

  /user/nickname:
    post:
      tags: [Users]
      summary: Legacy alias for updating the authenticated user's nickname.
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nickname]
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 32
      responses:
        "200":
          $ref: "#/components/responses/UserResponse"

  /user/{userId}:
    get:
      tags: [Users]
      summary: Get a public user profile.
      security: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          $ref: "#/components/responses/PublicUserProfileResponse"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"

  /user/{userId}/avatar/{submissionId}:
    get:
      tags: [Users]
      summary: Read an approved immutable user avatar.
      security: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved WebP avatar.
          headers:
            Cache-Control:
              schema: { type: string, const: "public, max-age=31536000, immutable" }
            ETag:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404": { $ref: "#/components/responses/ApiErrorResponse" }

  /user/{userId}/records:
    get:
      tags: [Records]
      summary: List user records.
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - name: mode
          in: query
          schema:
            type: string
        - name: mode_key
          in: query
          schema:
            type: string
        - name: mode_family
          in: query
          schema:
            type: string
            enum: [all, pow2, fibonacci, diagonal, special]
        - name: undo
          in: query
          schema:
            type: string
            enum: [all, no_undo, undo]
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [time, score, board_sum]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, deleted, all]
      responses:
        "200":
          description: User records.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: "#/components/schemas/GameRecord"

  /user/{userId}/stats:
    get:
      tags: [Records, Users]
      summary: Read aggregate user record statistics.
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: User record statistics.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserRecordStats"

  /leaderboard:
    get:
      tags: [Leaderboard]
      summary: Read leaderboard rows.
      security: []
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/PageQuery"
        - name: period
          in: query
          schema:
            type: string
            enum: [all, daily, weekly, monthly]
        - name: mode
          in: query
          schema:
            type: string
        - name: mode_key
          in: query
          schema:
            type: string
        - name: metric
          in: query
          schema:
            type: string
            enum: [score, speed]
        - name: target_tile
          in: query
          schema:
            type: integer
            enum: [2048, 4096, 8192, 16384, 32768]
      responses:
        "200":
          description: Leaderboard result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      metric:
                        type: string
                        enum: [score, speed]
                      target_tile:
                        type: integer
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboard/standard-4x4-no-undo:
    get:
      tags: [Leaderboard]
      summary: Read the isolated standard 4x4 no-undo showcase leaderboard.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Standard 4x4 no-undo showcase result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    required: [mode_key, summary, trend, data]
                    properties:
                      mode_key:
                        type: string
                        const: standard_4x4_pow2_no_undo
                      summary:
                        $ref: "#/components/schemas/LeaderboardShowcaseSummary"
                      trend:
                        type: array
                        minItems: 7
                        maxItems: 7
                        items:
                          $ref: "#/components/schemas/LeaderboardShowcaseTrendPoint"
                      achievement_focus:
                        $ref: "#/components/schemas/LeaderboardAchievementFocus"
                      data:
                        type: array
                        maxItems: 10
                        items:
                          $ref: "#/components/schemas/LeaderboardShowcaseEntry"

  /score:
    post:
      tags: [Records]
      summary: Legacy score submission endpoint.
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
