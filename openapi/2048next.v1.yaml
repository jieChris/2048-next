      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /records:
    post:
      tags: [Records]
      summary: Submit a completed game record.
      parameters:
        - $ref: "#/components/parameters/ClientVersionHeader"
        - $ref: "#/components/parameters/RecordModeKeyHeader"
        - $ref: "#/components/parameters/ClientRecordIdHeader"
        - $ref: "#/components/parameters/RecordDeliverySourceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameRecordSubmitRequest"
      responses:
        "200":
          description: Record submission result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      record:
                        $ref: "#/components/schemas/GameRecord"
                      achievements:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserAchievement"

  /records/uploads:
    post:
      tags: [Records]
      summary: Create or resume an idempotent chunk upload for a large replay.
      parameters:
        - $ref: "#/components/parameters/ClientVersionHeader"
        - $ref: "#/components/parameters/RecordModeKeyHeader"
        - $ref: "#/components/parameters/ClientRecordIdHeader"
        - $ref: "#/components/parameters/RecordDeliverySourceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUploadCreateRequest"
      responses:
        "200":
          description: Current upload task or an already completed matching record.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RecordUploadTask"

  /records/uploads/{taskId}:
    get:
      tags: [Records]
      summary: Read verified received chunks for an owned replay upload task.
      parameters:
        - $ref: "#/components/parameters/RecordUploadTaskIdPath"
      responses:
        "200":
          description: Current upload task.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RecordUploadTask"

  /records/uploads/{taskId}/chunks/{index}:
    put:
      tags: [Records]
      summary: Store one idempotent replay chunk after byte length and SHA-256 verification.
      parameters:
        - $ref: "#/components/parameters/RecordUploadTaskIdPath"
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 8191 }
        - name: X-Chunk-Sha256
          in: header
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
        - name: X-Chunk-Byte-Size
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/ClientVersionHeader"
        - $ref: "#/components/parameters/RecordModeKeyHeader"
        - $ref: "#/components/parameters/ClientRecordIdHeader"
        - $ref: "#/components/parameters/RecordDeliverySourceHeader"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

  /records/uploads/{taskId}/complete:
    post:
      tags: [Records]
      summary: Verify all chunks and atomically create or return the completed game record.
      parameters:
        - $ref: "#/components/parameters/RecordUploadTaskIdPath"
        - $ref: "#/components/parameters/ClientVersionHeader"
        - $ref: "#/components/parameters/RecordModeKeyHeader"
        - $ref: "#/components/parameters/ClientRecordIdHeader"
        - $ref: "#/components/parameters/RecordDeliverySourceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameRecordSubmitRequest"
      responses:
        "200":
          $ref: "#/components/responses/ApiEnvelopeResponse"

