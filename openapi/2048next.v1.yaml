      summary: List profile-bio submissions awaiting manual review.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [manual_review], default: manual_review }
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Manual moderation queue.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminModerationSubmission"
        "400": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "403": { $ref: "#/components/responses/NoStoreApiErrorResponse" }

  /admin/moderation/submissions/{submissionId}/review:
    post:
      tags: [Admin, Users]
      summary: Approve, reject, or requeue a manually reviewed profile bio.
      parameters:
        - $ref: "#/components/parameters/ModerationSubmissionIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReviewRequest"
      responses:
        "200":
          description: Idempotent moderation decision result.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ModerationReviewResult"
        "400": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "403": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "404": { $ref: "#/components/responses/NoStoreApiErrorResponse" }
        "409": { $ref: "#/components/responses/NoStoreApiErrorResponse" }

  /admin/moderation/submissions/{submissionId}/retry:
    post:
