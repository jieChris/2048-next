<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <title>2048 Next Admin</title>
  <link rel="icon" href="favicon.ico">
</head>
<body class="admin-console" data-page="admin-console" data-admin-access="checking">
  <div id="admin-gate" class="admin-gate" role="status" aria-live="polite">
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    <span id="admin-gate-text"></span>
  </div>

  <div id="admin-shell" class="admin-shell" hidden>
    <aside id="admin-sidebar" class="admin-sidebar" aria-label=""></aside>
    <div id="admin-sidebar-backdrop" class="admin-sidebar-backdrop" hidden></div>

    <div class="admin-workspace">
      <header id="admin-topbar" class="admin-topbar"></header>
      <main id="admin-content" class="admin-content" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="admin-dialog" class="admin-dialog" aria-labelledby="admin-dialog-title">
    <form method="dialog" class="card admin-dialog-card">
      <div class="card-header">
        <h2 id="admin-dialog-title" class="card-title"></h2>
        <button class="btn-close" value="cancel" aria-label="" data-dialog-close></button>
      </div>
      <div id="admin-dialog-body" class="card-body"></div>
      <div id="admin-dialog-actions" class="card-footer d-flex justify-content-end gap-2"></div>
    </form>
  </dialog>

  <div id="admin-toast" class="admin-toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/src/entries/admin.ts"></script>
</body>
</html>
