  <style>
    #guide-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 2000;
        display: none;
    }
    #guide-message {
        position: absolute;
        color: white;
        font-weight: bold;
        font-size: 24px;
        z-index: 2002;
        pointer-events: none;
    }
    #guide-arrow {
        font-size: 40px;
        display: block;
        line-height: 1;
        margin-bottom: 5px;
    }
    .guide-highlight {
        position: relative;
        z-index: 2001;
        background: #faf8ef;
        box-shadow: 0 0 0 5px #faf8ef, 0 0 20px 10px rgba(255, 255, 255, 0.5);
        border-radius: 4px;
    }
    .timer-scroll-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 1 1 0;
        min-width: 0;
        background: #eee4da;
        border-radius: 3px;
        padding: 0;
        text-decoration: none;
        color: #776e65;
        height: 32px;
        line-height: 1;
        font-size: 0;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
        transition: background-color 0.15s ease, color 0.15s ease;
    }
    .timer-scroll-btn:hover {
        background: #eee4da;
        color: #776e65;
    }
    .timer-scroll-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2.6;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
        transition: transform 0.15s ease;
    }
    .timer-scroll-btn[data-scroll-dir="-1"]:hover svg {
        transform: translateY(-1px);
    }
    .timer-scroll-btn[data-scroll-dir="1"]:hover svg {
        transform: translateY(1px);
    }
    #timer-scroll-controls {
        display: none;
        width: 235px;
        margin: 14px 0 0 15px;
        text-align: center;
        clear: both;
        padding-top: 0;
        gap: 6px;
        align-items: center;
        justify-content: center;
    }
