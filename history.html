<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 本地历史记录</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260606-fillframe">
  <link rel="icon" type="image/x-icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="shortcut icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png?v=20260704-png-opt">
  <link rel="manifest" href="/site.webmanifest?v=20260704-pwa-icons">
  <script src="/js/core_night_mode_preload.js?v=20260721-profile-text-v1"></script>
  <script src="/js/beta_access_preload.js?v=20260708-01"></script>
  <link href="style/main.css?v=20260721-float-containment-v1" rel="stylesheet" type="text/css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
</head>
<body data-page="history">
  <div class="container portal-container">
    <div class="portal-header">
      <a class="page-back-button" id="history-page-back" href="2048.html">首页</a>
      <h1 class="title page-title-visually-hidden">本地历史</h1>
      <div class="portal-nav">
        <a href="modes.html">模式</a>
        <a href="replay.html">回放</a>
      </div>
    </div>

    <div class="portal-card">
      <div class="portal-actions-inline">
        <span style="display:inline-flex;align-items:center;gap:8px;min-width:0;">
          <label for="history-undo">撤回</label>
          <select id="history-undo" class="settings-select portal-inline-select">
            <option value="no_undo">无撤回</option>
            <option value="undo">可撤回</option>
          </select>
        </span>

        <span style="display:inline-flex;align-items:center;gap:8px;min-width:0;">
          <label for="history-mode">模式</label>
          <select id="history-mode" class="settings-select portal-inline-select"></select>
        </span>

        <span style="display:inline-flex;align-items:center;gap:8px;min-width:0;">
          <label for="history-owner">归属</label>
          <select id="history-owner" class="settings-select portal-inline-select">
            <option value="">全部归属</option>
          </select>
        </span>

        <span style="display:inline-flex;align-items:center;gap:8px;min-width:0;">
          <label for="history-keyword">关键词</label>
          <input id="history-keyword" class="portal-inline-input" placeholder="模式/分数/盘面和/编号">
        </span>

        <span style="display:inline-flex;align-items:center;gap:8px;min-width:0;">
          <label for="history-sort">排序</label>
          <select id="history-sort" class="settings-select portal-inline-select">
            <option value="ended_desc">按时间（新到旧）</option>
            <option value="ended_asc">按时间（旧到新）</option>
            <option value="score_desc">按分数（高到低）</option>
            <option value="board_sum_desc">按盘面和（高到低）</option>
          </select>
        </span>

        <button class="replay-button" id="history-load-btn">刷新</button>
      </div>

      <div class="portal-actions-inline" style="margin-top:8px;">
        <button class="replay-button" id="history-export-all-btn">导出全部</button>
        <button class="replay-button" id="history-clear-all-btn">清空全部</button>
      </div>

      <div id="history-status" class="portal-status"></div>
      <div id="history-summary" class="portal-muted"></div>
    </div>

    <div class="portal-actions-inline" style="justify-content:flex-end; margin-bottom:10px;">
      <button class="replay-button" id="history-prev-page">上一页</button>
      <button class="replay-button" id="history-next-page">下一页</button>
    </div>

    <div id="history-list"></div>
  </div>

  <script type="module" src="./src/entries/history.ts"></script>
</body>
</html>
