<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>&#22238;&#25918;</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260606-fillframe">
  <link rel="icon" type="image/x-icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="shortcut icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png?v=20260606-fillframe">
  <link rel="manifest" href="/site.webmanifest?v=20260606-fillframe">
  <script src="/js/core_night_mode_preload.js?v=20260418-01"></script>
  <script src="/js/beta_access_preload.js?v=20260627-01"></script>
  <link href="style/main.css?v=20260608-toolkit-align" rel="stylesheet" type="text/css">
  <link href="style/replay_page_rebuild.css?v=20260418-01" rel="stylesheet" type="text/css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.google-analytics.com; style-src 'self' 'unsafe-inline';">
</head>
<body data-page="replay">
  <div class="container replay-v1-page">
    <div id="replay-imported-file-name" class="replay-imported-file-name" style="display: none;"></div>
    <div class="replay-top-stats">
      <div class="replay-metric-card">
        <span id="replay-score-label" class="replay-metric-label">&#20998;&#25968;&#65306;</span>
        <span id="replay-score-value" class="replay-metric-value">0</span>
      </div>
      <div class="replay-metric-card">
        <span id="replay-step-time-label" class="replay-metric-label">&#21333;&#27493;&#29992;&#26102;&#65306;</span>
        <span id="replay-step-timer" class="replay-metric-value" aria-live="polite">0.0000 s</span>
      </div>
    </div>

    <div class="replay-board-shell">
      <div class="game-container game-container-replay">
        <div class="game-message">
          <p></p>
        </div>
        <div class="grid-container">
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
          <div class="grid-row">
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
            <div class="grid-cell"></div>
          </div>
        </div>
        <div class="tile-container"></div>
      </div>
    </div>

    <div class="replay-progress-wrap">
      <input type="range" id="replay-progress" min="0" max="100" value="0">
    </div>

    <div class="replay-step-buttons">
      <button class="replay-control-btn" id="btn-rewind-10">&#36864;10</button>
      <button class="replay-control-btn" id="btn-rewind-1">&#36864;1</button>
      <button class="replay-control-btn" id="replay-pause-btn">&#26242;&#20572;</button>
      <button class="replay-control-btn" id="btn-forward-1">&#36827;1</button>
      <button class="replay-control-btn" id="btn-forward-10">&#36827;10</button>
    </div>

    <div class="replay-action-buttons">
      <button class="replay-control-btn replay-action-btn" id="replay-toggle-diagnostics-btn">&#32479;&#35745;&#20449;&#24687;</button>
      <button class="replay-control-btn replay-action-btn" id="replay-open-speed-btn">&#35774;&#32622;&#36895;&#24230;</button>
      <a id="import-replay-file-btn" class="import-replay-button replay-action-btn">&#23548;&#20837;&#22238;&#25918;</a>
      <a id="import-replay-text-btn" class="import-replay-button replay-action-btn">&#31896;&#36148;&#22238;&#25918;</a>
    </div>

    <div id="replay-diagnostics-panel" class="replay-diagnostics-panel" style="display: none;">
      <div id="replay-diagnostics-summary" class="replay-diagnostics-summary"></div>
      <div id="replay-diagnostics-samples" class="replay-diagnostics-samples"></div>
    </div>

    <div class="replay-hidden-scoreboard" aria-hidden="true">
      <div class="score-container">0</div>
      <div class="best-container">0</div>
    </div>
  </div>

  <div id="replay-modal" class="replay-modal-overlay" style="display: none;">
    <div class="replay-modal-content">
      <h3 id="replay-modal-title">&#22238;&#25918;</h3>
      <div id="replay-singleline-wrap" class="replay-singleline-wrap" style="display: none;">
        <input id="replay-singleline-input" class="replay-singleline-input" type="text" inputmode="numeric">
        <span id="replay-singleline-unit" class="replay-singleline-unit">ms</span>
      </div>
      <div id="replay-speed-mode-wrap" class="replay-speed-mode-wrap" style="display: none;">
        <label class="replay-speed-mode-label">
          <input id="replay-speed-mode-original" type="checkbox">
          <span id="replay-speed-mode-text">&#25353;&#21407;&#36895;&#22238;&#25918;</span>
        </label>
      </div>
      <textarea id="replay-textarea" class="replay-textarea"></textarea>
      <div class="replay-modal-actions">
        <button id="replay-action-btn" class="replay-button">&#25191;&#34892;</button>
        <button class="replay-button">&#20851;&#38381;</button>
      </div>
    </div>
  </div>

  <div id="replay-file-drop-overlay" class="replay-file-drop-overlay" style="display: none;">
    <div class="replay-file-drop-panel">
      <div id="replay-file-drop-title" class="replay-file-drop-title">&#25302;&#25341;&#22238;&#25918;&#25991;&#20214;&#21040;&#27492;&#22788;</div>
      <div id="replay-file-drop-hint" class="replay-file-drop-hint">&#25903;&#25345; .txt / .vrs / .rpl</div>
    </div>
  </div>

  <script type="module" src="./src/entries/replay.ts"></script>
</body>
</html>
