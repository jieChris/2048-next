        </label>
        <label>密码
          <input id="beta-register-password" class="beta-input" type="password" autocomplete="new-password" placeholder="至少 10 位">

        <div class="beta-code-row">

            <input id="beta-register-code" class="beta-input" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码">

          <button id="beta-register-send" class="beta-secondary-button" type="button">发送验证码</button>
