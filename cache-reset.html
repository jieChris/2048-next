<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>2048 缓存修复</title>
    <script src="/js/core_night_mode_preload.js?v=20260418-01"></script>
<link href="style/utility/cache-reset/page.css?v=20260630-css-maintenance-debt" rel="stylesheet" type="text/css">
</head>
<body>
  <main>
    <h1>正在修复缓存</h1>
    <p>请稍等，页面会自动返回 2048。</p>
    <p><a id="fallback-link" href="./2048.html">手动返回首页</a></p>
  </main>
  <script>
    (function () {
      function shouldClearRankedCheckpointState() {
        try {
          var params = new URLSearchParams(window.location.search || "");
          return (
            params.get("restore_ranked_checkpoint") === "1" ||
            params.get("clear_ranked_checkpoint") === "1"
          );
        } catch (_err) {
          return false;
        }
      }

      var target = "./2048.html?cache_reset=" + Date.now();
      if (shouldClearRankedCheckpointState()) {
        target += "&force_ranked_checkpoint=1";
      }
      var fallbackLink = document.getElementById("fallback-link");
      if (fallbackLink) fallbackLink.href = target;

      function removeStorageKeysByPrefix(storage, prefixes) {
        if (!storage) return;
        try {
          for (var index = storage.length - 1; index >= 0; index -= 1) {
            var key = storage.key(index);
            if (!key) continue;
            if (prefixes.some(function (prefix) { return key.indexOf(prefix) === 0; })) {
              storage.removeItem(key);
            }
          }
        } catch (_err) {}
      }

      function clearSavedStateWindowName() {
        try {
          var rawName = typeof window.name === "string" ? window.name : "";
          if (!rawName) return;
          var marker = "__gm_saved_state_v1__=";
          var kept = rawName.split("&").filter(function (part) {
            return part.indexOf(marker) !== 0;
          });
          window.name = kept.join("&");
        } catch (_err) {}
      }

      function clearRankedCheckpointState() {
        if (!shouldClearRankedCheckpointState()) return;
        var prefixes = [
          "ranked_checkpoint_local_mirror:v1:",
          "ranked_checkpoint_cleared_at:v1:",
          "savedGameStateByMode:v1:",
          "savedGameStateLiteByMode:v1:",
          "savedGameStateSyncByMode:v1:"
        ];
        removeStorageKeysByPrefix(window.localStorage, prefixes);
        removeStorageKeysByPrefix(window.sessionStorage, prefixes);
        clearSavedStateWindowName();
      }

      function clearCaches() {
        if (!("caches" in window) || !window.caches || typeof caches.keys !== "function") {
          return Promise.resolve();
        }
        return caches.keys().then(function (names) {
          return Promise.all(names.map(function (name) {
            return caches.delete(name);
          }));
        });
      }

      function unregisterServiceWorkers() {
        if (!("serviceWorker" in navigator) || !navigator.serviceWorker.getRegistrations) {
          return Promise.resolve();
        }
        return navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          }));
        });
      }

      Promise.resolve()
        .then(clearRankedCheckpointState)
        .then(unregisterServiceWorkers)
        .then(clearCaches)
        .catch(function () {})
        .then(function () {
          window.location.replace(target);
        });
    })();
  </script>
</body>
</html>
