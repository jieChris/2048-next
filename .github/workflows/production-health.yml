name: Production Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public services
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 https://2048next.cn/robots.txt >/dev/null
          curl --fail --silent --show-error --retry 3 --max-time 20 https://2048.xn--fiqs8s/ >/dev/null
          health="$(curl --fail --silent --show-error --retry 3 --max-time 20 https://2048next.cn/api/health)"
          node -e 'const h=JSON.parse(process.argv[1]); if(h.success!==true||h.database!=="ok") process.exit(1)' "$health"
