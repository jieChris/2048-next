name: Deploy Self Hosted (Manual)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "要部署的 main 完整 commit SHA（40 位）"
        required: true
        type: string
      confirm_production:
        description: "确认这是生产环境部署"
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-self-hosted-main
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  validate-release:
    name: Validate Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
    steps:
      - name: Validate selected commit
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Production deploys must run from refs/heads/main; selected ${GITHUB_REF}." >&2
            exit 1
          }
          test "${CONFIRM_PRODUCTION}" = "true" || {
            echo "Production confirmation was not accepted." >&2
            exit 1
          }
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          }
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}" || {
            echo "Selected commit ${GITHUB_SHA} does not match expected_sha ${EXPECTED_SHA}." >&2
            exit 1
          }

  smoke:
    name: Full Smoke Gate
    needs: validate-release
    uses: ./.github/workflows/smoke.yml

  build:
    name: Build Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install smoke browser
        run: npx playwright install --with-deps chromium

      - name: Verify release
        run: npm run verify:release

      - name: Build dist
        run: npm run build

      - name: Prepare release metadata
        id: meta
        run: |
          ts="$(date -u +%Y%m%d%H%M%S)"
          short_sha="${GITHUB_SHA::7}"
          release_id="${ts}-${short_sha}"
          artifact_name="dist-${release_id}.tar.gz"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

      - name: Archive dist bundle
        env:
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
        run: |
          test -d dist
          tar -czf "${ARTIFACT_NAME}" -C dist .

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.artifact_name }}
          retention-days: 14

  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
      DEPLOY_KEEP_RELEASES: ${{ vars.DEPLOY_KEEP_RELEASES || '5' }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      SSH_COMMON_OPTS: >-
        -o BatchMode=yes
        -o StrictHostKeyChecking=yes
        -o ConnectTimeout=20
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=6
        -o TCPKeepAlive=yes
    steps:
      - name: Validate primary deploy settings
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing secret: DEPLOY_HOST" >&2; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "Missing secret: DEPLOY_USER" >&2; exit 1; }
          test -n "${DEPLOY_ROOT}" || { echo "Missing secret: DEPLOY_ROOT" >&2; exit 1; }
          test -n "${DEPLOY_PORT}" || { echo "Missing secret: DEPLOY_PORT" >&2; exit 1; }

      - name: Checkout deployment config
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact

      - name: Start SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add server host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          tmp_known_hosts="$(mktemp)"

          for attempt in 1 2 3; do
            ssh-keyscan \
              -T 15 \
              -p "${DEPLOY_PORT}" \
              -t rsa,ecdsa,ed25519 \
              -H "${DEPLOY_HOST}" > "${tmp_known_hosts}" 2>/dev/null || true

            if [ -s "${tmp_known_hosts}" ]; then
              cat "${tmp_known_hosts}" >> ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              rm -f "${tmp_known_hosts}"
              exit 0
            fi

            sleep 3
          done

          rm -f "${tmp_known_hosts}"
          echo "Failed to fetch SSH host key from ${DEPLOY_HOST}:${DEPLOY_PORT} after 3 attempts." >&2
          exit 1

      - name: Upload package
        run: |
          set -euo pipefail
          artifact_path="artifact/${ARTIFACT_NAME}"
          remote_path="/tmp/${ARTIFACT_NAME}"

          for attempt in 1 2 3; do
            if scp ${SSH_COMMON_OPTS} -P "${DEPLOY_PORT}" \
              "${artifact_path}" \
              "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_path}"; then
              exit 0
            fi
            echo "WARN: scp upload attempt ${attempt} failed, retrying..." >&2
            sleep $((attempt * 5))
          done

          for attempt in 1 2 3; do
            if scp -O ${SSH_COMMON_OPTS} -P "${DEPLOY_PORT}" \
              "${artifact_path}" \
              "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_path}"; then
              echo "INFO: uploaded package via legacy scp protocol (-O)." >&2
              exit 0
            fi
            echo "WARN: legacy scp (-O) upload attempt ${attempt} failed, retrying..." >&2
            sleep $((attempt * 5))
          done

          for attempt in 1 2 3; do
            if ssh ${SSH_COMMON_OPTS} -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cat > '${remote_path}'" < "${artifact_path}"; then
              echo "INFO: uploaded package via ssh stream fallback." >&2
              exit 0
            fi
            echo "WARN: ssh stream upload attempt ${attempt} failed, retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "ERROR: failed to upload package after scp/legacy-scp/ssh-stream retries." >&2
          exit 1

      - name: Upload Nginx config
        run: |
          set -euo pipefail
          config_path="deploy/nginx/2048-next.nginx.conf.example"
          remote_path="/tmp/2048-next-nginx-${RELEASE_ID}.conf"
          test -f "${config_path}"

          for attempt in 1 2 3; do
            if scp ${SSH_COMMON_OPTS} -P "${DEPLOY_PORT}" \
              "${config_path}" \
              "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_path}"; then
              exit 0
            fi
            echo "WARN: nginx config upload attempt ${attempt} failed, retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "ERROR: failed to upload nginx config after 3 attempts." >&2
          exit 1

      - name: Activate release (atomic symlink)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh ${SSH_COMMON_OPTS} -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "bash -s -- '${DEPLOY_ROOT}' '${ARTIFACT_NAME}' '${RELEASE_ID}' '${DEPLOY_KEEP_RELEASES}' '/tmp/2048-next-nginx-${RELEASE_ID}.conf'" <<'REMOTE'
            set -euo pipefail
            deploy_root="$1"
            artifact_name="$2"
            release_id="$3"
            keep_releases="$4"
            nginx_config_path="$5"

            releases_dir="${deploy_root}/releases"
            release_dir="${releases_dir}/${release_id}"
            sudo -n true
            previous_release="$(sudo -n readlink -f "${deploy_root}/current" 2>/dev/null || true)"
            previous_nginx_config="$(mktemp)"

            cleanup_release_dir() {
              local target_dir="$1"
              [ -e "${target_dir}" ] || return 0
              if sudo -n rm -rf -- "${target_dir}"; then
                return 0
              fi
              echo "WARN: failed to fully remove ${target_dir}; skipping." >&2
              return 0
            }

            sudo -n mkdir -p "${releases_dir}" "${deploy_root}/shared"
            cleanup_release_dir "${release_dir}"
            sudo -n mkdir -p "${release_dir}"

            sudo -n tar -xzf "/tmp/${artifact_name}" -C "${release_dir}"
            rm -f "/tmp/${artifact_name}"

            sudo -n docker --version >/dev/null 2>&1
            test -f "${nginx_config_path}"
            if [ -f "${deploy_root}/nginx.conf" ]; then
              sudo -n cp "${deploy_root}/nginx.conf" "${previous_nginx_config}"
            fi
            docker_network_args=()
            if sudo -n docker network inspect edge-migrate-net >/dev/null 2>&1; then
              docker_network_args=(--network edge-migrate-net)
            fi
            sudo -n docker run --rm \
              "${docker_network_args[@]}" \
              -v "${nginx_config_path}:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine nginx -t

            sudo -n cp "${nginx_config_path}" "${deploy_root}/nginx.conf"
            rm -f "${nginx_config_path}"
            sudo -n ln -sfn "${release_dir}" "${deploy_root}/current"

            start_site_container() {
              if sudo -n docker ps -a --format '{{.Names}}' | grep -qx 'site-2048-next'; then
                sudo -n docker rm -f site-2048-next >/dev/null
              fi

              sudo -n docker run -d \
                "${docker_network_args[@]}" \
                --name site-2048-next \
                --restart unless-stopped \
                -p 127.0.0.1:2048:80 \
                -v "${deploy_root}/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
                -v "${deploy_root}/current:/usr/share/nginx/html:ro" \
                nginx:1.27-alpine >/dev/null
            }

            wait_for_site() {
              for health_attempt in $(seq 1 20); do
                if sudo -n docker exec site-2048-next wget -q --spider http://127.0.0.1/2048.html; then
                  return 0
                fi
                sleep 1
              done
              return 1
            }

            start_site_container
            if ! wait_for_site; then
              sudo -n docker logs --tail=80 site-2048-next || true
              if [ -n "${previous_release}" ] && [ -d "${previous_release}" ]; then
                sudo -n ln -sfn "${previous_release}" "${deploy_root}/current"
                if [ -s "${previous_nginx_config}" ]; then
                  sudo -n cp "${previous_nginx_config}" "${deploy_root}/nginx.conf"
                fi
                start_site_container
                wait_for_site || true
              fi
              cleanup_release_dir "${release_dir}"
              rm -f "${previous_nginx_config}"
              echo "ERROR: release health check failed; previous release restored." >&2
              exit 1
            fi
            rm -f "${previous_nginx_config}"

            cd "${releases_dir}"
            (sudo -n ls -1dt -- */ 2>/dev/null || true) | tail -n "+$((keep_releases + 1))" | while IFS= read -r old_release; do
              [ -n "${old_release}" ] || continue
              cleanup_release_dir "${old_release}"
            done
          REMOTE
            then
              exit 0
            fi
            echo "WARN: ssh activation attempt ${attempt} failed, retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "ERROR: failed to activate release after 3 attempts." >&2
          exit 1

      - name: Output deployed release
        run: echo "Deployed release ${RELEASE_ID} to ${DEPLOY_HOST}:${DEPLOY_ROOT}/current"
