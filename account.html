<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 账号中心</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260606-fillframe">
  <link rel="icon" type="image/x-icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="shortcut icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png?v=20260704-png-opt">
  <link rel="manifest" href="/site.webmanifest?v=20260704-pwa-icons">
  <script src="/js/core_night_mode_preload.js?v=20260418-01"></script>
  <script src="/js/beta_access_preload.js?v=20260627-01"></script>
  <link href="style/main.css?v=20260608-toolkit-align" rel="stylesheet" type="text/css">
  <link href="style/palette_page.css?v=20260310-01" rel="stylesheet" type="text/css">
  <link href="style/account_page.css?v=20260321-01" rel="stylesheet" type="text/css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://2048next.cn https://www.2048next.cn; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';">
</head>
<body data-page="account-hub" data-i18n-ready="0">
  <main class="palette-page-shell account-page-shell">
    <header class="palette-page-header">
      <div class="palette-title-wrap">
        <p class="palette-kicker" id="account-kicker">2048 在线中心</p>
        <h1 class="palette-title" id="account-title">账号中心</h1>
        <p class="palette-subtitle" id="account-subtitle">登录后可同步记录并查看在线排行榜。</p>
      </div>
      <nav class="palette-nav">
        <a class="replay-button palette-nav-btn" href="account_settings.html" id="account-nav-settings">账号设置</a>
        <a class="replay-button palette-nav-btn" href="2048.html" id="account-nav-home">首页</a>
        <a class="replay-button palette-nav-btn" href="history.html" id="account-nav-history">本地历史</a>
        <a class="replay-button palette-nav-btn" href="palette.html" id="account-nav-palette">主题设置</a>
        <a class="replay-button palette-nav-btn" href="Practice_board.html" id="account-nav-practice">练习盘</a>
      </nav>
    </header>

    <section class="account-grid">
      <section class="card-surface account-auth-card">
        <div class="panel-head account-auth-title-row">
          <div class="account-auth-title-wrap">
            <h2 id="account-auth-heading">账号登录</h2>
            <p id="account-auth-subtitle" class="account-auth-subtitle">登录后可同步记录并参与排行比较。</p>
          </div>
          <span id="account-auth-state-tag" class="panel-pill">--</span>
        </div>

        <div class="account-auth-form-surface">
          <div id="account-auth-grid" class="account-auth-grid">
            <div class="account-form-field">
              <label for="account-email" id="account-email-label">邮箱</label>
              <input id="account-email" class="account-input" type="email" placeholder="请输入邮箱">
            </div>

            <div class="account-form-field">
              <label for="account-password" id="account-password-label">密码</label>
              <input id="account-password" class="account-input" type="password" placeholder="请输入密码">
            </div>

            <div id="account-login-captcha-wrap" class="account-login-captcha" style="display:none;">
              <label for="account-login-captcha-answer" id="account-login-captcha-label">图形验证码</label>
              <div class="account-login-captcha-row">
                <img id="account-login-captcha-image" class="account-login-captcha-image" alt="登录验证码">
                <button id="account-login-captcha-refresh" class="replay-button account-login-captcha-refresh" type="button">刷新</button>
              </div>
              <input id="account-login-captcha-answer" class="account-input" type="text" maxlength="8" autocomplete="off" placeholder="请输入验证码">
            </div>
          </div>
        </div>

        <div id="account-action-row" class="account-action-row">
          <button id="account-login-btn" class="replay-button" type="button">登录</button>
          <a id="account-open-register-btn" class="replay-button" href="register.html">注册账号</a>
          <a id="account-open-reset-password-btn" class="replay-button" href="password.html?mode=reset">忘记密码</a>
        </div>

        <p id="account-auth-tip" class="account-tip" aria-live="polite"></p>

        <section class="account-user-card">
          <h3 id="account-user-title">当前账号</h3>
          <div class="account-user-lines">
            <div><span id="account-user-nickname-label">昵称：</span><strong id="account-user-nickname">--</strong></div>
            <div><span id="account-user-email-label">邮箱：</span><strong id="account-user-email">--</strong></div>
            <div><span id="account-user-created-label">创建时间：</span><strong id="account-user-created">--</strong></div>
          </div>
        </section>

        <section class="account-guide-card">
          <div class="panel-head account-guide-head">
            <div class="account-guide-copy">
              <h3 id="account-guide-title">新手指引</h3>
              <p id="account-guide-desc" class="account-guide-desc">返回首页并重新打开新手指引。</p>
            </div>
            <span id="account-guide-pill" class="panel-pill">Guide</span>
          </div>
          <button id="account-open-guide-btn" class="replay-button account-guide-open-btn" type="button">打开指引</button>
        </section>
      </section>

      <section class="card-surface account-board-card">
        <div class="panel-head account-board-title-row">
          <div class="account-board-title-wrap">
            <h2 id="account-board-heading">排行榜</h2>
            <p id="account-board-subtitle" class="account-board-subtitle">按模式与指标筛选记录进行比较。</p>
          </div>
        </div>
        <div class="account-board-filter-row" role="group" aria-label="排行榜筛选">
          <div class="account-board-tools">
            <label for="account-board-mode" id="account-board-mode-label">模式</label>
            <select id="account-board-mode" class="settings-select"></select>
            <label for="account-board-metric" id="account-board-metric-label">指标</label>
            <select id="account-board-metric" class="settings-select"></select>
            <button id="account-board-refresh" class="replay-button" type="button">刷新</button>
          </div>
        </div>
        <div class="account-board-table-wrap">
          <div class="account-board-head-row">
            <span id="account-col-rank">排名</span>
            <span id="account-col-name">昵称</span>
            <span id="account-col-score">分数</span>
            <span id="account-col-date">更新时间</span>
          </div>
          <div id="account-board-list" class="account-board-list" data-board-state="idle" aria-live="polite"></div>
        </div>
        <div class="account-board-pagination">
          <button id="account-board-prev" class="replay-button" type="button">上一页</button>
          <span id="account-board-page" class="account-page-indicator">第1页</span>
          <button id="account-board-next" class="replay-button" type="button">下一页</button>
        </div>
        <p id="account-board-tip" class="account-tip" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <script type="module" src="./src/entries/account.ts"></script>
</body>
</html>
