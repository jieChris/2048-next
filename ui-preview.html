      var source = document.getElementById("top-action-source");
      var groupTemplate = document.getElementById("preview-groups-template");
      var variants = Array.from(document.querySelectorAll("[data-preview-variant]"));

      if (runtime && source && groupTemplate) {
        runtime.applyTopActionBindings({
          getElementById: document.getElementById.bind(document)
        });

        variants.forEach(function (variant) {
          var fragment = groupTemplate.content.cloneNode(true);
          var topMount = fragment.querySelector("[data-top-actions-mount]");
          Array.from(source.children).forEach(function (button) {
            var clone = button.cloneNode(true);
            removeIds(clone);
            topMount.appendChild(clone);
          });
          variant.querySelector("[data-variant-content]").appendChild(fragment);
        });

        source.remove();
        runtime.applyTopActionBindings({
          getElementById: document.getElementById.bind(document)
        });
      }

      document.querySelector("[data-preview-button-workbench]").addEventListener("click", function (event) {
        var control = event.target.closest("[data-preview-control]");
        if (control) event.preventDefault();
      });

      applyCopy(currentLanguage());
    })();
  </script>
</body>
</html>
