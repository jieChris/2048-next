<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>2048 Account Settings</title>
  <link href="style/main.css?v=20260316-04" rel="stylesheet" type="text/css">
  <link href="style/palette_page.css?v=20260310-01" rel="stylesheet" type="text/css">
  <link href="style/account_page.css?v=20260321-01" rel="stylesheet" type="text/css">
  <link href="style/account_settings_page.css?v=20260321-01" rel="stylesheet" type="text/css">
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260305-2">
  <link rel="shortcut icon" href="meta/favicon.svg?v=20260305-2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://taihe.fun https://www.taihe.fun; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';">
</head>
<body data-page="account-settings-hub" data-i18n-ready="0">
  <main class="palette-page-shell account-settings-page-shell">
    <header class="palette-page-header">
      <div class="palette-title-wrap">
        <p class="palette-kicker" id="settings-kicker">2048 Online Hub</p>
        <h1 class="palette-title" id="settings-title">Account Settings</h1>
        <p class="palette-subtitle" id="settings-subtitle">Manage nickname, password and session in one place.</p>
      </div>
      <nav class="palette-nav">
        <a class="replay-button palette-nav-btn" href="account.html" id="settings-nav-account">Back to Account</a>
        <a class="replay-button palette-nav-btn" href="2048.html" id="settings-nav-home">Home</a>
      </nav>
    </header>

    <section class="card-surface settings-card">
      <section class="settings-section">
        <h2 id="settings-nickname-heading">Change Nickname</h2>
        <div class="account-auth-grid settings-grid">
          <label id="settings-current-nickname-label" for="settings-new-nickname">Current Nickname</label>
          <div class="settings-current-nickname-wrap">
            <strong id="settings-current-nickname">--</strong>
          </div>

          <label id="settings-new-nickname-label" for="settings-new-nickname">New Nickname</label>
          <input id="settings-new-nickname" class="account-input" type="text" maxlength="20" placeholder="Enter new nickname">
          <p id="settings-nickname-feedback" class="settings-feedback" aria-live="polite"></p>
        </div>
        <div class="account-action-row settings-action-row">
          <button id="settings-update-nickname-btn" class="replay-button" type="button">Save Nickname</button>
        </div>
      </section>

      <section class="settings-section">
        <h2 id="settings-password-heading">Change Password</h2>
        <div class="account-auth-grid settings-grid">
          <label id="settings-current-password-label" for="settings-current-password">Current Password</label>
          <input id="settings-current-password" class="account-input" type="password" placeholder="Enter current password">

          <label id="settings-new-password-label" for="settings-new-password">New Password</label>
          <input id="settings-new-password" class="account-input" type="password" placeholder="Enter new password">
        </div>
        <div class="account-action-row settings-action-row">
          <button id="settings-change-password-btn" class="replay-button" type="button">Change Password</button>
        </div>
      </section>

      <section class="settings-section">
        <h2 id="settings-session-heading">Session</h2>
        <div class="account-action-row settings-action-row">
          <button id="settings-logout-btn" class="replay-button" type="button">Logout</button>
        </div>
      </section>

      <p id="settings-tip" class="account-tip" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./src/entries/account-settings.ts"></script>
</body>
</html>
