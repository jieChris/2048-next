<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>用户主页</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260606-fillframe">
  <link rel="icon" type="image/x-icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="shortcut icon" href="meta/favicon.ico?v=20260606-fillframe">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png?v=20260704-png-opt">
  <link rel="manifest" href="/site.webmanifest?v=20260704-pwa-icons">
  <script src="/js/core_night_mode_preload.js?v=20260721-profile-text-v1"></script>
  <script src="/js/beta_access_preload.js?v=20260708-01"></script>
  <link href="style/main.css?v=20260721-float-containment-v1" rel="stylesheet" type="text/css">
  <link href="style/palette_page.css?v=20260310-01" rel="stylesheet" type="text/css">
  <link href="style/user_profile_page.css?v=20260721-record-sort-v10" rel="stylesheet" type="text/css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://2048next.cn https://www.2048next.cn https://*.myqcloud.com; script-src 'self'; style-src 'self' 'unsafe-inline';">
</head>
<body data-page="user-profile" data-i18n-ready="0">
  <main class="palette-page-shell user-page-shell">
    <header class="palette-page-header">
      <div class="palette-title-wrap">
        <a class="page-back-button" href="2048.html" id="user-nav-home">首页</a>
        <div class="page-title-visually-hidden">
          <h1 class="palette-title" id="user-title">用户主页</h1>
          <p class="user-profile-inline-info" id="user-inline-info" aria-live="polite">
            <span id="user-label-name">昵称：</span><strong id="user-value-name">--</strong>
            <span class="user-info-sep" aria-hidden="true">&middot;</span>
            <span id="user-label-created">注册时间：</span><strong id="user-value-created">--</strong>
          </p>
        </div>
      </div>
      <nav class="palette-nav">
        <a class="replay-button palette-nav-btn" href="account.html" id="user-nav-account">排行榜</a>
        <details class="user-nav-menu">
          <summary class="replay-button palette-nav-btn user-nav-menu-summary" id="user-nav-menu">菜单</summary>
          <div class="user-nav-menu-panel">
            <a class="replay-button palette-nav-btn" href="account_settings.html" id="user-nav-settings">账号设置</a>
            <a class="replay-button palette-nav-btn" href="history.html" id="user-nav-history">本地历史</a>
            <a class="replay-button palette-nav-btn" href="replay.html" id="user-nav-replay">回放</a>
            <a class="replay-button palette-nav-btn" href="palette.html" id="user-nav-palette">设置</a>
            <a class="replay-button palette-nav-btn" href="Practice_board.html" id="user-nav-practice">练习板</a>
            <a class="replay-button palette-nav-btn" href="medal-wall.html" id="user-nav-medals">勋章墙</a>
            <button class="replay-button palette-nav-btn" id="user-nav-logout" type="button">退出账号</button>
          </div>
        </details>
      </nav>
    </header>

    <details class="user-summary-details" id="user-summary-details">
      <summary class="user-summary-summary">
        <span class="user-summary-preview" id="user-summary-preview">--</span>
        <span class="user-summary-chevron" aria-hidden="true"></span>
      </summary>
      <div class="user-summary-row" role="group" aria-label="用户摘要">
        <div class="user-summary-card">
          <span id="user-summary-total-label">总记录数</span>
          <strong id="user-summary-total-value">--</strong>
        </div>
        <div class="user-summary-card">
          <span id="user-summary-best-score-label">最高分</span>
          <strong id="user-summary-best-score-value">--</strong>
        </div>
        <div class="user-summary-card">
          <span id="user-summary-best-tile-label">最大方块</span>
          <strong id="user-summary-best-tile-value">--</strong>
        </div>
        <div class="user-summary-card">
          <span id="user-summary-last-active-label">最近活跃</span>
          <strong id="user-summary-last-active-value">--</strong>
        </div>
      </div>
    </details>

    <section class="card-surface user-record-card">
        <div class="panel-head user-record-panel-head">
          <h2 id="user-record-heading">历史记录</h2>
          <button id="user-record-refresh" class="replay-button" type="button">刷新</button>
        </div>

        <div class="user-record-tools">
          <div class="user-record-field user-record-undo-field">
            <label for="user-record-undo" id="user-undo-label">撤回</label>
            <select id="user-record-undo" class="settings-select">
              <option value="no_undo">无撤回</option>
              <option value="undo">可撤回</option>
            </select>
          </div>
          <div class="user-record-field user-record-mode-field">
            <label for="user-record-mode" id="user-mode-label">模式</label>
            <select id="user-record-mode" class="settings-select">
              <option value="standard_no_undo">4x4</option>
              <option value="pow2_3x3">3x3</option>
              <option value="pow2_2x4">2x4</option>
              <option value="pow2_3x4">3x4</option>
              <option value="pow2_5x5">5x5</option>
            </select>
          </div>
          <div class="user-record-field user-record-sort-field">
            <label for="user-record-sort" id="user-sort-label">排序字段</label>
            <select id="user-record-sort" class="settings-select">
              <option value="time">上传时间</option>
              <option value="score">分数</option>
              <option value="board_sum">盘面和</option>
            </select>
          </div>
          <div class="user-record-field user-record-order-field">
            <label for="user-record-order" id="user-order-label">顺序</label>
            <select id="user-record-order" class="settings-select">
              <option value="desc">倒序</option>
              <option value="asc">正序</option>
            </select>
          </div>
          <div class="user-record-field user-record-visibility-field" id="user-record-visibility-field">
            <label for="user-record-visibility" id="user-visibility-label">记录状态</label>
            <select id="user-record-visibility" class="settings-select">
              <option value="active">有效</option>
              <option value="deleted">已删除</option>
              <option value="all">全部</option>
            </select>
          </div>
        </div>

        <div class="user-record-head-row">
          <span id="user-col-mode">模式</span>
          <span id="user-col-score">分数</span>
          <span id="user-col-board-sum">盘面和</span>
          <span id="user-col-best-tile">最大方块</span>
          <span id="user-col-duration">用时</span>
          <span id="user-col-date">更新时间</span>
        </div>
        <div id="user-record-list" class="user-record-list"></div>
        <div class="user-record-pager">
          <button id="user-record-prev" class="replay-button" type="button">上一页</button>
          <span id="user-record-page" class="user-page-indicator">第1页</span>
          <button id="user-record-next" class="replay-button" type="button">下一页</button>
        </div>
        <p id="user-record-tip" class="user-tip" aria-live="polite"></p>
      </section>
  </main>

  <script type="module" src="./src/entries/user-profile.ts"></script>
</body>
</html>
