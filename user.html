<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>用户主页</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="meta/favicon.svg?v=20260409-1">
  <link rel="icon" type="image/x-icon" href="meta/favicon.ico?v=20260409-1">
  <link rel="shortcut icon" href="meta/favicon.ico?v=20260409-1">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png?v=20260409-1">
  <link rel="manifest" href="site.webmanifest?v=20260409-1">
  <link href="style/main.css?v=20260327-01" rel="stylesheet" type="text/css">
  <link href="style/palette_page.css?v=20260310-01" rel="stylesheet" type="text/css">
  <link href="style/user_profile_page.css?v=20260316-02" rel="stylesheet" type="text/css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://taihe.fun https://www.taihe.fun https://*.myqcloud.com; script-src 'self'; style-src 'self' 'unsafe-inline';">
</head>
<body data-page="user-profile" data-i18n-ready="0">
  <main class="palette-page-shell user-page-shell">
    <header class="palette-page-header">
      <div class="palette-title-wrap">
        <p class="palette-kicker" id="user-kicker">2048 在线中心</p>
        <h1 class="palette-title" id="user-title">用户主页</h1>
        <p class="palette-subtitle" id="user-subtitle">查看用户历史记录，可按时间或分数排序。</p>
      </div>
      <nav class="palette-nav">
        <a class="replay-button palette-nav-btn" href="2048.html" id="user-nav-home">首页</a>
        <a class="replay-button palette-nav-btn" href="account.html" id="user-nav-account">账号中心</a>
      </nav>
    </header>

    <section class="user-grid">
      <section class="card-surface user-info-card">
        <div class="panel-head">
          <h2 id="user-info-heading">基础信息</h2>
        </div>
        <div class="user-info-lines">
          <div><span id="user-label-name">昵称：</span><strong id="user-value-name">--</strong></div>
          <div><span id="user-label-created">创建时间：</span><strong id="user-value-created">--</strong></div>
        </div>
      </section>

      <section class="card-surface user-record-card">
        <div class="panel-head">
          <h2 id="user-record-heading">历史记录</h2>
          <div class="user-record-tools">
            <label for="user-record-mode" id="user-mode-label">模式</label>
            <select id="user-record-mode" class="settings-select">
              <option value="all">全部</option>
              <option value="standard_no_undo">标准（无撤回）</option>
              <option value="standard_undo">标准（可撤回）</option>
              <option value="pow2_3x3">3x3</option>
              <option value="pow2_2x4">2x4</option>
              <option value="pow2_3x4">3x4</option>
              <option value="fib_3x3">斐波那契 3x3</option>
            </select>
            <label for="user-record-sort-by" id="user-sort-by-label">排序字段</label>
            <select id="user-record-sort-by" class="settings-select">
              <option value="time">时间</option>
              <option value="score">分数</option>
            </select>
            <label for="user-record-order" id="user-order-label">排序方向</label>
            <select id="user-record-order" class="settings-select">
              <option value="desc">降序</option>
              <option value="asc">升序</option>
            </select>
            <label for="user-record-visibility" id="user-visibility-label">记录状态</label>
            <select id="user-record-visibility" class="settings-select">
              <option value="active">有效</option>
              <option value="deleted">已删除</option>
              <option value="all">全部</option>
            </select>
            <button id="user-record-refresh" class="replay-button" type="button">刷新</button>
          </div>
        </div>

        <div class="user-record-head-row">
          <span id="user-col-mode">模式</span>
          <span id="user-col-score">分数</span>
          <span id="user-col-date">更新时间</span>
        </div>
        <div id="user-record-list" class="user-record-list"></div>
        <div class="user-record-pager">
          <button id="user-record-prev" class="replay-button" type="button">上一页</button>
          <span id="user-record-page" class="user-page-indicator">第1页</span>
          <button id="user-record-next" class="replay-button" type="button">下一页</button>
        </div>
        <p id="user-record-tip" class="user-tip" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <script type="module" src="./src/entries/user-profile.ts"></script>
</body>
</html>
